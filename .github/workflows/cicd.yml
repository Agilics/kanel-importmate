name: AppExchange CI/CD

on:
  push:
    branches: [develop, main, "release/*"]
  pull_request:
    branches: [develop, main, "release/*"]
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  # 0. Validation préalable (sans environnement Salesforce)
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchroniser package-lock.json
        run: |
          echo "🔄 Synchronisation du package-lock.json..."
          rm -f package-lock.json
          npm install
          echo "✅ package-lock.json synchronisé"
      - run: npm ci
      - name: Validation du code
        run: |
          echo "Validation de la syntaxe et structure..."
          # npm run lint
          # npm run test:unit:coverage
          # npm run prettier:verify

  # 1. Pre-merge Integration Testing (PRs to develop)
  pre-merge-integration:
    environment: integration
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchroniser package-lock.json
        run: |
          echo "🔄 Synchronisation du package-lock.json..."
          rm -f package-lock.json
          npm install
          echo "✅ package-lock.json synchronisé"
      - run: npm ci
      # - run: npm run lint
      # - run: npm run test:unit:coverage
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Authenticate to Integration Sandbox
        run: |
          # Create JWT key file
          echo "$SF_JWT_KEY" | tr -d '\r' > jwt.key
          chmod 600 jwt.key

          # Authenticate with Salesforce
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file jwt.key --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias int-sandbox
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY_FILE }}
          SF_CLIENT_ID: ${{ secrets.SF_CONNECTED_APP_CONSUMER_KEY }}
          SF_USERNAME: ${{ secrets.SF_INT_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INT_INSTANCE_URL }}
      - name: Generate manifest from source
        run: sf project generate manifest --source-dir force-app --output-dir manifest
      - name: Validation complète avec org cible
        run: |
          echo "🔍 Validation complète contre l'org d'intégration..."
          sf project deploy validate --manifest manifest/package.xml --target-org int-sandbox --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          echo "✅ Validation complète réussie"
      - name: Deploy & Test in Integration Sandbox
        run: |
          echo "🚀 Deploying to integration sandbox for pre-merge validation..."
          sf project deploy start --manifest manifest/package.xml --target-org int-sandbox --ignore-conflicts --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          echo "🧪 Running tests in integration sandbox..."
          sf apex run test --test-level RunLocalTests --target-org int-sandbox --wait 10
          echo "✅ Pre-merge validation successful - ready to merge!"
      - run: rm -f jwt.key

  # 2. Integration Testing in Dedicated Sandbox (feature/develop branches)
  integration:
    environment: integration
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchroniser package-lock.json
        run: |
          echo "🔄 Synchronisation du package-lock.json..."
          rm -f package-lock.json
          npm install
          echo "✅ package-lock.json synchronisé"
      - run: npm ci
      # - run: npm run lint
      # - run: npm run test:unit:coverage
      #- run: npm run prettier:verify
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Authenticate to Integration Sandbox
        run: |
          printf "%s" "${{ secrets.SF_JWT_KEY_FILE }}" > jwt.key
          sf org login jwt --client-id ${{ secrets.SF_CONNECTED_APP_CONSUMER_KEY }} --jwt-key-file jwt.key --username ${{ secrets.SF_INT_USERNAME }} --instance-url ${{ secrets.SF_INT_INSTANCE_URL }} --alias int-sandbox
      - name: Generate manifest from source
        run: sf project generate manifest --source-dir force-app --output-dir manifest
      - name: Validation complète avec org cible
        run: |
          echo "🔍 Validation complète contre l'org d'intégration..."
          sf project deploy validate --manifest manifest/package.xml --target-org int-sandbox --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          echo "✅ Validation complète réussie"

      - name: Deploy & Test in Integration Sandbox
        run: |
          sf project deploy start --manifest manifest/package.xml --target-org int-sandbox --ignore-conflicts --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          sf apex run test --test-level RunLocalTests --target-org int-sandbox --wait 10
      - run: rm -f jwt.key

  # 3. UAT in Sandbox (release/* branch)
  uat:
    environment: uat
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs: [validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchroniser package-lock.json
        run: |
          echo "🔄 Synchronisation du package-lock.json..."
          rm -f package-lock.json
          npm install
          echo "✅ package-lock.json synchronisé"
      - run: npm ci
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Authenticate to UAT Sandbox
        run: |
          printf "%s" "${{ secrets.SF_JWT_KEY_FILE }}" > jwt.key
          sf org login jwt --client-id ${{ secrets.SF_CONNECTED_APP_CONSUMER_KEY }} --jwt-key-file jwt.key --username ${{ secrets.SF_UAT_USERNAME }} --instance-url ${{ secrets.SF_UAT_INSTANCE_URL }} --alias uat-org
      - name: Generate manifest from source
        run: sf project generate manifest --source-dir force-app --output-dir manifest
      - name: Validation complète avec org UAT
        run: |
          echo "🔍 Validation complète contre l'org UAT..."
          sf project deploy validate --manifest manifest/package.xml --target-org uat-org --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          echo "✅ Validation complète réussie"

      - name: Deploy & Test in UAT Sandbox
        run: |
          sf project deploy start --manifest manifest/package.xml --target-org uat-org --ignore-conflicts --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          sf apex run test --test-level RunLocalTests --target-org uat-org --wait 10
      - run: rm -f jwt.key

  # 4. Package Creation in Packaging Env Hub DE Org (main branch, manual trigger)
  package:
    environment: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [validation]
    outputs:
      package_version_id: ${{ steps.create_version.outputs.package_version_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Authenticate to Packaging DE Org
        run: |
          # Create JWT key file
          echo "$SF_JWT_KEY" | tr -d '\r' > jwt.key
          chmod 600 jwt.key

          # Authenticate with Salesforce
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file jwt.key --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias pkg-org
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY_FILE }}
          SF_CLIENT_ID: ${{ secrets.SF_CONNECTED_APP_CONSUMER_KEY }}
          SF_USERNAME: ${{ secrets.SF_PKG_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_PKG_INSTANCE_URL }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Generate manifest from source
        run: sf project generate manifest --source-dir force-app --output-dir manifest
      - name: Validation complète avec org de packaging
        run: |
          echo "🔍 Validation complète contre l'org de packaging..."
          sf project deploy validate --manifest manifest/package.xml --target-org pkg-org --pre-destructive-changes config/destructive/destructiveChanges.xml --post-destructive-changes config/destructive/destructiveChangesPost.xml
          echo "✅ Validation complète réussie"
      - name: Create Package if not exists
        run: |
          echo "📦 Création du package si nécessaire..."
          if ! sf package list --target-dev-hub pkg-org --json | jq -e '.result[] | select(.Name=="KANEL-IMPORTMATE")' > /dev/null 2>&1; then
            echo "📦 Le package n'existe pas, création en cours..."
            sf package create "KANEL-IMPORTMATE" --path force-app --package-type Unmanaged --target-dev-hub pkg-org
            echo "✅ Package créé avec succès"
          else
            echo "ℹ️ Le package existe déjà"
          fi
      - name: Create Package Version
        id: create_version
        run: |
          echo "🚀 Création de la version du package..."
          JSON_OUTPUT=$(sf package version create --package "KANEL-IMPORTMATE" --installation-key-bypass --wait 20 --target-dev-hub pkg-org --json)
          
          if [ $? -ne 0 ]; then
            echo "❌ Erreur lors de la création de la version du package"
            echo "$JSON_OUTPUT"
            exit 1
          fi
          
          VERSION_ID=$(echo "$JSON_OUTPUT" | jq -r '.result.SubscriberPackageVersionId // empty')
          
          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" == "null" ]; then
            echo "❌ Erreur : Impossible d'extraire l'ID de version du package"
            echo "$JSON_OUTPUT"
            exit 1
          fi
          
          echo "✅ Version du package créée : $VERSION_ID"
          echo "package_version_id=$VERSION_ID" >> $GITHUB_OUTPUT
      - run: rm -f jwt.key

  # 5. Subscriber Org Install/Upgrade Test (manual trigger)
  subscriber-test:
    environment: subscriber
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [validation, package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchroniser package-lock.json
        run: |
          echo "🔄 Synchronisation du package-lock.json..."
          rm -f package-lock.json
          npm install
          echo "✅ package-lock.json synchronisé"
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Authenticate to Subscriber Org
        run: |
          printf "%s" "${{ secrets.SF_JWT_KEY_FILE }}" > jwt.key
          sf org login jwt --client-id ${{ secrets.SF_CONNECTED_APP_CONSUMER_KEY }} --jwt-key-file jwt.key --username ${{ secrets.SF_SUB_USERNAME }} --instance-url ${{ secrets.SF_SUB_INSTANCE_URL }} --alias sub-org
      - name: Install/Upgrade Package
        run: |
          sf package install --package ${{ needs.package.outputs.package_version_id }} --target-org sub-org --wait 20
      - run: rm -f jwt.key
