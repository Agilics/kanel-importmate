   @description       : Data source selector page - shows selection cards for CSV or SOQL

-->
<template>
    <div class="container" id="container">
      <!-- header title -->
      <div class="header">
        <h1 class="header-title">Choose Data Source</h1>
        <p class="header-subtitle">
          Select how you want to import your data into Salesforce
        </p>
      </div>
      <div class="cards">
        <!-- CARD FILE UPLOAD -->
        <div class="upload">
          <c-data-source-card
            contents={uploadContents}
            title={uploadTitle}
            subtitle={uploadSubtitle}
            is-upload={isUpload}
            current-project={currentProject}
            oncardaction={handleCSV}
          >
          </c-data-source-card>
        </div>
        <!-- END CARD FILE UPLOAD -->
  
        <!-- CARD QUERY BUILDER -->
        <div class="query">
          <c-data-source-card
            contents={queryContents}
            title={queryTitle}
            subtitle={querySubTitle}
            is-upload={isNotUpload}
            current-project={currentProject}
            oncardaction={handleSOQL}
          >
          </c-data-source-card>
        </div>
        <!-- END CARD QUERY UPLOAD -->
      </div>
  
        <!-- Cancel Button -->
      <button type="button" class="btn btn-secondary" onclick={handleBackToProjectSetup}>
          <span>Back</span>
      </button>
    </div>
  </template>
