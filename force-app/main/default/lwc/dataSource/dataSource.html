<!--
   @description       : Data source selector page - shows selection cards for CSV or SOQL
   @author            : ChangeMeIn@UserSettingsUnder.SFDoc
   @group             : 
   @last modified on  : 04-22-2026
   @last modified by  : Mouhamed NIANG
   @Modification: Add project's name 
-->
   <template>
    <div class="container" id="container">

        <!-- Header title -->
        <div class="header">
            <div class="flex">
                <h1 class="header-title">{label.title}</h1>
                <span class="badge primary-badge header-subtitle ">
                  {projectName}
                </span>
            </div>
            <p class="header-subtitle">{label.subtitle}</p>
        </div>

        <div class="cards">

            <!-- CARD FILE UPLOAD -->
            <div class="upload">
                <c-data-source-card
                    contents={uploadContents}
                    title={label.uploadTitle}
                    subtitle={label.uploadSubtitle}
                    text-button={textButton}
                    is-upload={isUpload}
                    current-project={currentProject}
                    oncardaction={handleCSV}
                ></c-data-source-card>
            </div>
            <!-- END CARD FILE UPLOAD -->

            <!-- CARD QUERY BUILDER -->
            <div class="query">
                <c-data-source-card
                    contents={queryContents}
                    title={label.queryTitle}
                    subtitle={label.querySubTitle}
                    text-button={textButton}
                    is-upload={isNotUpload}
                    current-project={currentProject}
                    oncardaction={handleSOQL}
                ></c-data-source-card>
            </div>
            <!-- END CARD QUERY BUILDER -->

        </div>

        <!-- Back Button -->
        <button type="button" class="btn btn-secondary" onclick={handleBackToProjectSetup}>
            <span>{label.back}</span>
        </button>

    </div>
</template>
