<template>
  <div class="dash-main">

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1 class="greeting"><em>{sections.title}</em> 👋</h1>
        <p class="page-sub">{sections.detailsTitle}</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick={handleNewProject}>
          ＋ {buttonLabel.newProject}
        </button>
      </div>
    </div>

    <!-- Stats grid -->
    <div class="stats-grid">
      <template for:each={stats} for:item="stat">
        <div key={stat.id} class="stat-card">
          <div class="stat-top">
            <div class="stat-icon">{stat.icon}</div>
            <template if:true={stat.change}>
              <span class="stat-trend trend-up">{stat.change}</span>
            </template>
          </div>
          <div class="stat-value">{stat.value}</div>
          <div class="stat-label">{stat.label}</div>
        </div>
      </template>
    </div>

    <!-- Section header -->
    <div class="section-row">
      <span class="section-title">Projets récents</span>
    </div>

    <!-- Filters: search + status select -->
    <div class="filters">
      <div class="search-box">
        <span class="search-icon-emoji">🔍</span>
        <input type="text" placeholder={placeholder} onchange={handleSearch}/>
      </div>
      <template for:each={filterTabs} for:item="tab">
        <button key={tab.value} class={tab.className} data-value={tab.value} onclick={handleFilterChange}>
          {tab.label}
        </button>
      </template>
    </div>

    <!-- Loading -->
    <template if:true={isLoading}>
      <div class="loading-container">
        <div class="dash-spinner"></div>
      </div>
    </template>

    <!-- Projects grid (has data) -->
    <template if:true={hasProjects}>
      <div class="projects-grid">
        <template for:each={projects} for:item="project">
          <c-project-card
            key={project.Id}
            project={project}
            onprojectselect={handleProjectSelect}
            onprojectedit={handleProjectEdit}
            onprojectdelete={handleProjectDelete}>
          </c-project-card>
        </template>
        <!-- "New project" card always shown at end of grid -->
        <div class="project-card-new" onclick={handleNewProject}>
          <div class="new-icon">＋</div>
          <div class="new-label">{buttonLabel.newProject}</div>
          <div class="new-sub">Importez de nouvelles données Salesforce en quelques clics</div>
        </div>
      </div>
    </template>

    <!-- Empty state -->
    <template if:false={hasProjects}>
      <template if:false={isLoading}>
        <div class="projects-grid">
          <div class="project-card-new" onclick={handleNewProject}>
            <div class="new-icon">＋</div>
            <div class="new-label">{buttonLabel.createFirstProject}</div>
            <div class="new-sub">Importez de nouvelles données Salesforce en quelques clics</div>
          </div>
        </div>
      </template>
    </template>

  </div>
</template>
