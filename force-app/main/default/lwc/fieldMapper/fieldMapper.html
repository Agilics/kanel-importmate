<template>
  <lightning-card title="Field Mapping" icon-name="custom:custom63">
    <div class="slds-p-around_medium">
      <!-- Top controls: Project | Target Object | Version -->
      <div class="header-row">
        <!-- Project (pruned to the selected one) -->
        <lightning-combobox
          label="Project"
          value={selectedProjectId}
          options={projectOptions}
          onchange={handleProjectChange}
          disabled={isProjectLocked}
        >
        </lightning-combobox>

        <!-- Target Object (read-only, comes from the selected project) -->
        <lightning-input
          type="text"
          label="Target Object"
          value={selectedTargetObject}
          disabled
          class="target-object"
        >
        </lightning-input>

        <!-- Version -->
        <lightning-input
          type="text"
          label="Version"
          value={versionInput}
          onchange={handleVersionChange}
        >
        </lightning-input>
      </div>

      <!-- Actions -->
      <div class="actions-row">
        <lightning-button
          label="Load Saved Mappings"
          title="Apply previously saved mappings to the board"
          onclick={handleLoadSavedClick}
        >
        </lightning-button>

        <lightning-button
          label="Clear All"
          variant="destructive"
          title="Remove all mappings and restore CSV list"
          onclick={handleClearAllClick}
        >
        </lightning-button>

        <lightning-button
          class="slds-m-left_auto"
          label="Save Mappings"
          variant="brand"
          onclick={handleSave}
        >
        </lightning-button>
      </div>

      <!-- ===== BOARD: Source LEFT | Target RIGHT ===== -->
      <div class="field-map-board">
        <!-- SOURCES LEFT -->
        <section class="column column--sources">
          <div class="column__header">
            <h2 class="slds-text-heading_small">Source Fields (CSV)</h2>
          </div>
          <div class="column__body">
            <template if:true={availableSourceColumns}>
              <template for:each={availableSourceColumns} for:item="source">
                <div
                  key={source}
                  class="draggable"
                  draggable="true"
                  data-source={source}
                  ondragstart={handleDragStart}
                >
                  {source}
                </div>
              </template>
            </template>
            <template if:false={availableSourceColumns}>
              <p class="muted slds-m-top_small">No source columns to show.</p>
            </template>
          </div>
        </section>

        <!-- TARGETS RIGHT (scrollable) -->
        <section class="column column--targets">
          <div class="column__header">
            <h2 class="slds-text-heading_small">Target Fields</h2>
          </div>
          <div class="column__body">
            <template if:true={targetFields}>
              <template for:each={targetFields} for:item="field">
                <div
                  key={field.apiName}
                  class="drop-zone"
                  data-target={field.apiName}
                  ondragover={handleDragOver}
                  ondrop={handleDrop}
                >
                  <strong>{field.label}</strong>

                  <!-- Mapped sources under this target field -->
                  <template if:true={field.mappedSources}>
                    <template for:each={field.mappedSources} for:item="ms">
                      <div key={ms.sourceColumn} class="mapped-item">
                        <div
                          class="slds-grid slds-wrap slds-grid_vertical-align-center"
                        >
                          <div class="slds-col slds-grow">
                            {ms.sourceColumn}
                          </div>
                          <div class="slds-col">
                            <lightning-button
                              variant="destructive-text"
                              label="Unmap"
                              data-source={ms.sourceColumn}
                              onclick={handleRemoveMapping}
                            >
                            </lightning-button>
                          </div>
                        </div>

                        <!-- Lookup toggle -->
                        <div class="slds-m-top_x-small">
                          <lightning-input
                            type="checkbox"
                            label="Use as lookup"
                            checked={ms.mapping.isLookup}
                            data-source={ms.sourceColumn}
                            onchange={handleLookupToggle}
                          >
                          </lightning-input>
                        </div>

                        <!-- Lookup object + match field -->
                        <template if:true={ms.mapping.isLookup}>
                          <div class="slds-m-top_x-small">
                            <lightning-combobox
                              label="Lookup Object"
                              value={ms.mapping.lookupObject}
                              data-source={ms.sourceColumn}
                              options={availableObjectsOptions}
                              onchange={handleLookupObjectChange}
                            >
                            </lightning-combobox>

                            <lightning-combobox
                              class="slds-m-top_x-small"
                              label="Match Field"
                              value={ms.mapping.lookupMatchField}
                              data-source={ms.sourceColumn}
                              options={ms.lookupFieldsOptions}
                              onchange={handleLookupFieldChange}
                            >
                            </lightning-combobox>
                          </div>
                        </template>
                      </div>
                    </template>
                  </template>

                  <template if:false={field.mappedSources}>
                    <div class="hint slds-m-top_x-small">
                      Drop a source column here…
                    </div>
                  </template>
                </div>
              </template>
            </template>

            <template if:false={targetFields}>
              <p class="muted slds-m-top_small">
                Select a project to load target fields.
              </p>
            </template>
          </div>
        </section>
      </div>
    </div>
  </lightning-card>

  <c-backbutton onback={handleBackFromMapper}></c-backbutton>
</template>
