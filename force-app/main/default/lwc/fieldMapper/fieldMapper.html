<template>
  <lightning-card>
    <div class="fm-root">
      <!-- Header -->
      <div class="fm-header slds-p-horizontal_medium slds-p-top_medium">
        <div class="fm-title">
          <h1 class="fm-heading">Field Mapping</h1>
          <p class="fm-subtitle">Map source columns to Salesforce fields</p>
        </div>

        <div class="fm-actions">
          <lightning-button
            label="Auto-Map"
            class="ghost"
            onclick={handleAutoMapClick}
          ></lightning-button>
          <lightning-button
            label="Clear All"
            onclick={handleClearAllClick}
          ></lightning-button>
          <lightning-button
            label="Save Mapping"
            onclick={handleSaveMapping}
          ></lightning-button>
          <lightning-button
            label="Back"
            onclick={handleBackClick}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label="Continue"
            onclick={handleContinueClick}
          ></lightning-button>
        </div>
      </div>

      <!-- Controls kept for logic but visually hidden -->
      <div
        class="fm-controls fm-controls--hidden slds-p-horizontal_medium slds-p-top_small"
      >
        <lightning-combobox
          label="Project"
          value={selectedProjectId}
          options={projectOptions}
          onchange={handleProjectChange}
          disabled={isProjectLocked}
        ></lightning-combobox>

        <lightning-input
          type="text"
          label="Salesforce Object"
          value={selectedTargetObject}
          disabled
        ></lightning-input>

        <lightning-input
          type="text"
          label="Version"
          value={versionInput}
          onchange={handleVersionChange}
        ></lightning-input>

        <lightning-button
          label="Load Saved"
          onclick={handleLoadSavedClick}
        ></lightning-button>
        <lightning-button
          variant="brand"
          label="Save"
          onclick={handleSave}
        ></lightning-button>
      </div>

      <!-- Two columns -->
      <div class="fm-grid slds-p-around_medium">
        <!-- Left: Sources -->
        <section class="fm-panel">
          <div class="fm-panel__header">
            <h2>{sourceTitle}</h2>
            <span class="fm-count">{_csvRows.length} rows</span>
          </div>

          <div class="fm-source-list">
            <template if:true={hasSourceList}>
              <template for:each={sourceList} for:item="item">
                <div
                  key={item.name}
                  class="fm-source-row"
                  draggable="true"
                  data-source={item.name}
                  ondragstart={handleDragStart}
                >
                  <div class="fm-source-main">
                    <svg width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 16H0V0H10V16Z" stroke="#E5E7EB"/>
                    <path d="M1.25 11H2.75C3.44062 11 4 11.5594 4 12.25V13.75C4 14.4406 3.44062 15 2.75 15H1.25C0.559375 15 0 14.4406 0 13.75V12.25C0 11.5594 0.559375 11 1.25 11ZM7.25 11H8.75C9.44063 11 10 11.5594 10 12.25V13.75C10 14.4406 9.44063 15 8.75 15H7.25C6.55937 15 6 14.4406 6 13.75V12.25C6 11.5594 6.55937 11 7.25 11ZM1.25 10C0.559375 10 0 9.44063 0 8.75V7.25C0 6.55937 0.559375 6 1.25 6H2.75C3.44062 6 4 6.55937 4 7.25V8.75C4 9.44063 3.44062 10 2.75 10H1.25ZM7.25 6H8.75C9.44063 6 10 6.55937 10 7.25V8.75C10 9.44063 9.44063 10 8.75 10H7.25C6.55937 10 6 9.44063 6 8.75V7.25C6 6.55937 6.55937 6 7.25 6ZM1.25 5C0.559375 5 0 4.44062 0 3.75V2.25C0 1.55937 0.559375 1 1.25 1H2.75C3.44062 1 4 1.55937 4 2.25V3.75C4 4.44062 3.44062 5 2.75 5H1.25ZM7.25 1H8.75C9.44063 1 10 1.55937 10 2.25V3.75C10 4.44062 9.44063 5 8.75 5H7.25C6.55937 5 6 4.44062 6 3.75V2.25C6 1.55937 6.55937 1 7.25 1Z" fill="#9CA3AF"/>
                    </svg> 
                    <div class="src-icon" aria-hidden="true"></div>
                    <div class="name-wrap" >
                 
                      <div class="name">{item.name}</div>
                      <div class="sub">{item.subtitle}</div>
                    </div>
                  </div>

                  <template if:true={item.isMapped}>
                    <span class={item.pillClass}>Mapped</span>
                  </template>
                  <template if:true={item.isUnmapped}>
                    <span class={item.pillClass}>Unmapped</span>
                  </template>
                  <template if:true={item.isTransform}>
                    <span class={item.pillClass}>+Transform</span>
                  </template>
                </div>
              </template>
            </template>

            <template if:false={hasSourceList}>
              <p class="muted">No source columns.</p>
            </template>
          </div>
        </section>

        <!-- Right: Targets & summary -->
        <section class="fm-right">
          <div class="fm-target-header">
            <div class="title">
              <h2>Salesforce Fields ({selectedTargetObject})</h2>
            </div>
            <button
              class="fm-settings-btn"
              type="button"
              title="Preview settings"
              aria-label="Preview settings"
              onclick={openSettings}
            >
              <span class="gear" aria-hidden="true"></span>
          </button>

          </div>

          <div class="fm-target-list">
            <template for:each={targetFields} for:item="field">
              <article
                key={field.apiName}
                class={field.cardClass}
                data-target={field.apiName}
                ondragover={handleDragOver}
                ondrop={handleDrop}
              >
                <div class="fm-target-top">
                  <div class="left">
                    <div class={field.iconCssClass} aria-hidden="true"></div>
                    <div class="labels">
                      <div class="t-label">{field.label}</div>
                      <div class="t-sub">{field.typeLabel}</div>
                    </div>
                  </div>

                  <template if:true={field.mappedSources}>
                    <template for:each={field.mappedSources} for:item="ms">
                      <div key={ms.key} class={ms.chipClass}>
                        <span class="chip-text">{ms.sourceColumn}</span>
                        <lightning-button-icon
                          icon-name="utility:close"
                          variant="bare"
                          size="x-small"
                          alternative-text="Unmap"
                          title="Unmap"
                          data-source={ms.sourceColumn}
                          onclick={handleRemoveMapping}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </template>
                </div>

                <!-- Lookup / drop area -->
                <template if:true={field.mappedSources}>
                  <template for:each={field.mappedSources} for:item="ms">
                    <div key={ms.key} class="lookup-block">
                      <lightning-input
                        type="checkbox"
                        label="Use as lookup"
                        checked={ms.mapping.isLookup}
                        data-source={ms.sourceColumn}
                        onchange={handleLookupToggle}
                      ></lightning-input>

                      <template if:true={ms.mapping.isLookup}>
                        <div class="lookup-row">
                          <lightning-combobox
                            class="lkp"
                            label="Lookup Object"
                            value={ms.mapping.lookupObject}
                            data-source={ms.sourceColumn}
                            options={availableObjectsOptions}
                            onchange={handleLookupObjectChange}
                          ></lightning-combobox>

                          <lightning-combobox
                            class="lkp"
                            label="Match Field"
                            value={ms.mapping.lookupMatchField}
                            data-source={ms.sourceColumn}
                            options={ms.lookupFieldsOptions}
                            onchange={handleLookupFieldChange}
                          ></lightning-combobox>
                        </div>
                      </template>
                    </div>
                  </template>
                </template>

                <template if:false={field.mappedSources}>
                  <div class="fm-drop-hint">Drop here or select</div>
                </template>
              </article>
            </template>
          </div>

          <!-- Summary -->
          <aside class="fm-summary">
            <div class="sum-title">Mapping Summary</div>
            <div class="sum-row">
              <span class="sum-label">Total Fields:</span>
              <span class="sum-val">{summaryTotalFields}</span>
            </div>
            <div class="sum-row">
              <span class="sum-label">Mapped:</span>
              <span class="sum-val sum-green">{summaryMappedCount}</span>
            </div>
            <div class="sum-row">
              <span class="sum-label">Unmapped:</span>
              <span class="sum-val sum-red">{summaryUnmappedCount}</span>
            </div>
            <div class="sum-row">
              <span class="sum-label">With Transformations:</span>
              <span class="sum-val sum-blue">{summaryWithTransformCount}</span>
            </div>
          </aside>
        </section>
      </div>

      <!-- Preview -->
      <div class="fm-preview slds-p-horizontal_medium slds-p-bottom_large">
        <div class="prev-title">Data Preview</div>
        <div class="prev-sub">
          Preview of mapped data with transformations applied
        </div>

        <div class="table-wrap">
          <table class="prev-table">
            <thead>
              <tr>
                <template if:true={hasMappedFields}>
                  <template for:each={mappedFields} for:item="f">
                    <th key={f.apiName}>{f.label}</th>
                  </template>
                </template>
              </tr>
            </thead>
            <tbody>
              <template if:true={hasClientPreview}>
                <template for:each={clientPreviewRows} for:item="row">
                  <tr key={row._key}>
                    <template for:each={row.cells} for:item="cell">
                      <td key={cell.key}>{cell.value}</td>
                    </template>
                  </tr>
                </template>
              </template>

              <template if:false={hasClientPreview}>
                <tr>
                  <td colspan={previewColspan} class="muted">
                    No preview available.
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Settings modal -->
    <template if:true={showSettingsModal}>
      <section class="fm-modal-backdrop" role="presentation">
        <div
          class="fm-modal"
          role="dialog"
          aria-modal="true"
          aria-label="Preview settings"
        >
          <header class="fm-modal__header">
            <h2>Preview settings</h2>
          </header>
          <div class="fm-modal__body">
            <lightning-input
              type="number"
              label="Number of preview rows"
              value={settingsPreviewRowLimit}
              min="1"
              max="50"
              onchange={handleSettingsRowLimitChange}
            ></lightning-input>
          </div>
          <footer class="fm-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleSettingsCancel}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label="Apply"
              onclick={handleSettingsApply}
            ></lightning-button>
          </footer>
        </div>
      </section>
    </template>
  </lightning-card>
</template>
