<template>
  <lightning-card>
    <div class="fm-root">
      <div class="fm-header slds-p-horizontal_medium slds-p-top_medium">
        <div class="fm-title">
          <h1 class="fm-heading">{label_Title}</h1>
          <p class="fm-subtitle">{label_Subtitle}</p>

          <template if:true={selectedProjectId}>
            <div class="fm-meta">
              <span class="fm-meta-pill">{currentProjectName}</span>
            </div>
          </template>
        </div>

        <div class="fm-actions">
          <lightning-button label={label_AutoMap} class="ghost" onclick={handleAutoMapClick}></lightning-button>
          <lightning-button label={label_ClearAll} onclick={handleClearAllClick}></lightning-button>
          <lightning-button label={label_SaveMapping} onclick={handleSaveMapping}></lightning-button>
          <lightning-button label={label_Back} onclick={handleBackClick}></lightning-button>
          <lightning-button
            variant="brand"
            label={label_Continue}
            onclick={handleContinueClick}
            disabled={isContinueButtonDisabled}
          ></lightning-button>
        </div>
      </div>

      <div class="fm-grid slds-p-around_medium">
        <!-- Left -->
        <section class="fm-panel">
          <div class="fm-panel__header">
            <h2>{sourceTitle}</h2>
            <span class="fm-count">{rowCountLabel} {label_Rows}</span>
          </div>

          <div class="fm-source-list">
            <template if:true={hasSourceList}>
              <template for:each={sourceList} for:item="item">
                <div
                  key={item.name}
                  class="fm-source-row"
                  draggable="true"
                  data-source={item.name}
                  ondragstart={handleDragStart}
                >
                  <div class="fm-source-main">
                    <div class="name-wrap">
                      <div class="name">{item.name}</div>
                      <div class="sub">{item.subtitle}</div>
                    </div>
                  </div>

                  <span class={item.pillClass}>{item.pillLabel}</span>
                </div>
              </template>
            </template>

            <template if:false={hasSourceList}>
              <p class="muted">{label_NoSourceColumns}</p>
            </template>
          </div>
        </section>

        <!-- Right -->
        <section class="fm-right">
          <div class="fm-target-header">
            <div class="title">
              <h2>{label_SalesforceFields} ({selectedTargetObject})</h2>
            </div>

            <span class="set" onclick={openSettings}>
              <span class="set-label">{label_Configure}</span>
            </span>
          </div>

          <div class="fm-target-list">
            <template for:each={targetFields} for:item="field">
              <article
                key={field.apiName}
                class={field.cardClass}
                data-target={field.apiName}
                ondragover={handleDragOver}
                ondrop={handleDrop}
              >
                <div class="fm-target-top">
                  <div class="left">
                    <div class={field.iconCssClass} aria-hidden="true"></div>
                    <div class="labels">
                      <div class="t-label">{field.label}</div>
                      <div class="t-sub">{field.typeLabel}</div>
                    </div>
                  </div>

                  <template if:true={field.mappedSources}>
                    <template for:each={field.mappedSources} for:item="ms">
                      <div key={ms.key} class={ms.chipClass}>
                        <span class="chip-text">{ms.sourceColumn}</span>
                        <lightning-button-icon
                          icon-name="utility:close"
                          variant="bare"
                          size="x-small"
                          alternative-text="Unmap"
                          title="Unmap"
                          data-source={ms.sourceColumn}
                          onclick={handleRemoveMapping}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </template>
                </div>

                <template if:true={field.mappedSources}>
                  <template for:each={field.mappedSources} for:item="ms">
                    <div key={ms.key} class="lookup-block">
                      <lightning-input
                        type="checkbox"
                        label={label_UseAsLookup}
                        checked={ms.mapping.isLookup}
                        data-source={ms.sourceColumn}
                        onchange={handleLookupToggle}
                      ></lightning-input>

                      <template if:true={ms.mapping.isLookup}>
                        <div class="lookup-row">
                          <lightning-combobox
                            class="lkp"
                            label={label_LookupObject}
                            value={ms.mapping.lookupObject}
                            data-source={ms.sourceColumn}
                            options={availableObjectsOptions}
                            onchange={handleLookupObjectChange}
                          ></lightning-combobox>

                          <lightning-combobox
                            class="lkp"
                            label={label_MatchField}
                            value={ms.mapping.lookupMatchField}
                            data-source={ms.sourceColumn}
                            options={ms.lookupFieldsOptions}
                            onchange={handleLookupFieldChange}
                          ></lightning-combobox>
                        </div>
                      </template>
                    </div>
                  </template>
                </template>
              </article>
            </template>
          </div>
        </section>
      </div>

      <!-- Preview -->
      <div class="fm-preview slds-p-horizontal_medium slds-p-bottom_large">
        <div class="prev-title">{label_PreviewTitle}</div>
        <div class="prev-subtitle">{label_PreviewSubtitle}</div>
        <div class="table-wrap">
          <table class="prev-table">
            <thead>
              <tr>
                <template if:true={hasMappedFields}>
                  <template for:each={mappedFields} for:item="f">
                    <th key={f.apiName}>{f.label}</th>
                  </template>
                </template>
              </tr>
            </thead>
            <tbody>
              <template if:true={hasClientPreview}>
                <template for:each={clientPreviewRows} for:item="row">
                  <tr key={row._key}>
                    <template for:each={row.cells} for:item="cell">
                      <td key={cell.key}>{cell.value}</td>
                    </template>
                  </tr>
                </template>
              </template>

              <template if:false={hasClientPreview}>
                <tr>
                  <td colspan={previewColspan} class="muted">{label_NoPreview}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Settings modal -->
    <template if:true={showSettingsModal}>
      <section class="fm-modal-backdrop" role="presentation">
        <div class="fm-modal" role="dialog" aria-modal="true" aria-label={label_PreviewSettings}>
          <header class="fm-modal__header">
            <h2>{label_PreviewSettings}</h2>
          </header>
          <div class="fm-modal__body">
            <lightning-input
              type="number"
              label={label_NumberOfPreviewRows}
              value={settingsPreviewRowLimit}
              min="1"
              max="50"
              onchange={handleSettingsRowLimitChange}
            ></lightning-input>
          </div>
          <footer class="fm-modal__footer">
            <lightning-button label={label_Cancel} onclick={handleSettingsCancel}></lightning-button>
            <lightning-button variant="brand" label={label_Apply} onclick={handleSettingsApply}></lightning-button>
          </footer>
        </div>
      </section>
    </template>
  </lightning-card>
</template>
