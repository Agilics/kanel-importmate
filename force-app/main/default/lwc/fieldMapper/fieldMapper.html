<template>
  <lightning-card>
    <div class="fm-root">
      <!-- Header -->
      <div class="fm-header slds-p-horizontal_medium slds-p-top_medium">
        <div class="fm-title">
          <h1 class="fm-heading">Field Mapping</h1>
          <p class="fm-subtitle">Map source columns to Salesforce fields</p>

          <template if:true={selectedProjectId}>
            <div class="fm-meta">
              <!-- Plus de clic / modal de versions -->
              <span class="fm-meta-pill">
                {currentProjectName}
              </span>
            </div>
          </template>
        </div>

        <div class="fm-actions">
          <lightning-button
            label="Auto-Map"
            class="ghost"
            onclick={handleAutoMapClick}
          ></lightning-button>
          <lightning-button
            label="Clear All"
            onclick={handleClearAllClick}
          ></lightning-button>
          <lightning-button
            label="Save Mapping"
            onclick={handleSaveMapping}
          ></lightning-button>
          <lightning-button
            label="Back"
            onclick={handleBackClick}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label="Continue"
            onclick={handleContinueClick}
          ></lightning-button>
        </div>
      </div>
      <!-- Two columns -->
      <div class="fm-grid slds-p-around_medium">
        <!-- Left: Sources -->
        <section class="fm-panel">
          <div class="fm-panel__header">
            <h2>{sourceTitle}</h2>
            <span class="fm-count">{rowCountLabel} rows</span>
          </div>

          <div class="fm-source-list">
            <template if:true={hasSourceList}>
              <template for:each={sourceList} for:item="item">
                <div
                  key={item.name}
                  class="fm-source-row"
                  draggable="true"
                  data-source={item.name}
                  ondragstart={handleDragStart}
                >
                  <div class="fm-source-main">
                    <svg
                      width="10"
                      height="16"
                      viewBox="0 0 10 16"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path d="M10 16H0V0H10V16Z" stroke="#E5E7EB"></path>
                      <path
                        d="M1.25 11H2.75C3.44062 11 4 11.5594 4 12.25V13.75C4 14.4406 3.44062 15 2.75 15H1.25C0.559375 15 0 14.4406 0 13.75V12.25C0 11.5594 0.559375 11 1.25 11ZM7.25 11H8.75C9.44063 11 10 11.5594 10 12.25V13.75C10 14.4406 9.44063 15 8.75 15H7.25C6.55937 15 6 14.4406 6 13.75V12.25C6 11.5594 6.55937 11 7.25 11ZM1.25 10C0.559375 10 0 9.44063 0 8.75V7.25C0 6.55937 0.559375 6 1.25 6H2.75C3.44062 6 4 6.55937 4 7.25V8.75C4 9.44063 3.44062 10 2.75 10H1.25ZM7.25 6H8.75C9.44063 6 10 6.55937 10 7.25V8.75C10 9.44063 9.44063 10 8.75 10H7.25C6.55937 10 6 9.44063 6 8.75V7.25C6 6.55937 6.55937 6 7.25 6ZM1.25 5C0.559375 5 0 4.44062 0 3.75V2.25C0 1.55937 0.559375 1 1.25 1H2.75C3.44062 1 4 1.55937 4 2.25V3.75C4 4.44062 3.44062 5 2.75 5H1.25ZM7.25 1H8.75C9.44063 1 10 1.55937 10 2.25V3.75C10 4.44062 9.44063 5 8.75 5H7.25C6.55937 5 6 4.44062 6 3.75V2.25C6 1.55937 6.55937 1 7.25 1Z"
                        fill="#9CA3AF"
                      ></path>
                    </svg>
                    <div class="src-icon" aria-hidden="true"></div>
                    <div class="name-wrap">
                      <div class="name">{item.name}</div>
                      <div class="sub">{item.subtitle}</div>
                    </div>
                  </div>

                  <template if:true={item.isMapped}>
                    <span class={item.pillClass}>Mapped</span>
                  </template>
                  <template if:true={item.isUnmapped}>
                    <span class={item.pillClass}>Unmapped</span>
                  </template>
                  <template if:true={item.isTransform}>
                    <span class={item.pillClass}>+Transform</span>
                  </template>
                </div>
              </template>
            </template>

            <template if:false={hasSourceList}>
              <p class="muted">No source columns.</p>
            </template>
          </div>
        </section>

        <!-- Right: Targets -->
        <section class="fm-right">
          <div class="fm-target-header">
            <div class="title">
              <h2>Salesforce Fields ({selectedTargetObject})</h2>
            </div>

            <!-- Bouton "Configure" pour le preview settings -->
            <span class="set" onclick={openSettings}>
              <svg
                title="Preview settings"
                aria-label="Preview settings"
                width="14"
                height="14"
                viewBox="0 0 14 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g clip-path="url(#clip0_27_4359)">
                  <path
                    d="M13.5597 4.55547C13.6472 4.79336 13.5734 5.05859 13.3847 5.22813L12.2007 6.30547C12.2308 6.53242 12.2472 6.76484 12.2472 7C12.2472 7.23516 12.2308 7.46758 12.2007 7.69453L13.3847 8.77187C13.5734 8.94141 13.6472 9.20664 13.5597 9.44453C13.4394 9.76992 13.2945 10.0816 13.1277 10.3824L12.9992 10.6039C12.8187 10.9047 12.6164 11.1891 12.3949 11.457C12.2336 11.6539 11.9656 11.7195 11.725 11.643L10.2019 11.159C9.83551 11.4406 9.43082 11.6758 8.99879 11.8535L8.65699 13.4148C8.6023 13.6637 8.4109 13.8605 8.15933 13.9016C7.78199 13.9645 7.39371 13.9973 6.99722 13.9973C6.60074 13.9973 6.21246 13.9645 5.83511 13.9016C5.58355 13.8605 5.39215 13.6637 5.33746 13.4148L4.99566 11.8535C4.56363 11.6758 4.15894 11.4406 3.79254 11.159L2.27222 11.6457C2.0316 11.7223 1.76363 11.6539 1.6023 11.4598C1.38082 11.1918 1.17847 10.9074 0.998005 10.6066L0.869489 10.3852C0.702693 10.0844 0.557771 9.77266 0.437458 9.44727C0.349958 9.20938 0.423786 8.94414 0.612458 8.77461L1.79644 7.69727C1.76636 7.46758 1.74996 7.23516 1.74996 7C1.74996 6.76484 1.76636 6.53242 1.79644 6.30547L0.612458 5.22813C0.423786 5.05859 0.349958 4.79336 0.437458 4.55547C0.557771 4.23008 0.702693 3.91836 0.869489 3.61758L0.998005 3.39609C1.17847 3.09531 1.38082 2.81094 1.6023 2.54297C1.76363 2.34609 2.0316 2.28047 2.27222 2.35703L3.79527 2.84102C4.16168 2.55938 4.56636 2.32422 4.9984 2.14648L5.34019 0.585156C5.39488 0.336328 5.58629 0.139453 5.83785 0.0984375C6.21519 0.0328125 6.60347 0 6.99996 0C7.39644 0 7.78472 0.0328125 8.16207 0.0957031C8.41363 0.136719 8.60504 0.333594 8.65972 0.582422L9.00152 2.14375C9.43355 2.32148 9.83824 2.55664 10.2046 2.83828L11.7277 2.3543C11.9683 2.27773 12.2363 2.34609 12.3976 2.54023C12.6191 2.8082 12.8214 3.09258 13.0019 3.39336L13.1304 3.61484C13.2972 3.91562 13.4421 4.22734 13.5625 4.55273L13.5597 4.55547ZM6.99996 9.1875C7.58012 9.1875 8.13652 8.95703 8.54675 8.5468C8.95699 8.13656 9.18746 7.58016 9.18746 7C9.18746 6.41984 8.95699 5.86344 8.54675 5.4532C8.13652 5.04297 7.58012 4.8125 6.99996 4.8125C6.4198 4.8125 5.8634 5.04297 5.45316 5.4532C5.04293 5.86344 4.81246 6.41984 4.81246 7C4.81246 7.58016 5.04293 8.13656 5.45316 8.5468C5.8634 8.95703 6.4198 9.1875 6.99996 9.1875Z"
                    fill="#1E40AF"
                  />
                </g>
                <defs>
                  <clipPath id="clip0_27_4359">
                    <path d="M0 0H14V14H0V0Z" fill="white" />
                  </clipPath>
                </defs>
              </svg>
              <span class="set-label">Configure</span>
            </span>
          </div>

          <div class="fm-target-list">
            <template for:each={targetFields} for:item="field">
              <article
                key={field.apiName}
                class={field.cardClass}
                data-target={field.apiName}
                ondragover={handleDragOver}
                ondrop={handleDrop}
              >
                <div class="fm-target-top">
                  <div class="left">
                    <div class={field.iconCssClass} aria-hidden="true"></div>
                    <div class="labels">
                      <div class="t-label">{field.label}</div>
                      <div class="t-sub">{field.typeLabel}</div>
                    </div>
                  </div>

                  <template if:true={field.mappedSources}>
                    <template for:each={field.mappedSources} for:item="ms">
                      <div key={ms.key} class={ms.chipClass}>
                        <span class="chip-text">{ms.sourceColumn}</span>
                        <lightning-button-icon
                          icon-name="utility:close"
                          variant="bare"
                          size="x-small"
                          alternative-text="Unmap"
                          title="Unmap"
                          data-source={ms.sourceColumn}
                          onclick={handleRemoveMapping}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </template>
                </div>

                <!-- Lookup / drop area -->
                <template if:true={field.mappedSources}>
                  <template for:each={field.mappedSources} for:item="ms">
                    <div key={ms.key} class="lookup-block">
                      <lightning-input
                        type="checkbox"
                        label="Use as lookup"
                        checked={ms.mapping.isLookup}
                        data-source={ms.sourceColumn}
                        onchange={handleLookupToggle}
                      ></lightning-input>

                      <template if:true={ms.mapping.isLookup}>
                        <div class="lookup-row">
                          <lightning-combobox
                            class="lkp"
                            label="Lookup Object"
                            value={ms.mapping.lookupObject}
                            data-source={ms.sourceColumn}
                            options={availableObjectsOptions}
                            onchange={handleLookupObjectChange}
                          ></lightning-combobox>

                          <lightning-combobox
                            class="lkp"
                            label="Match Field"
                            value={ms.mapping.lookupMatchField}
                            data-source={ms.sourceColumn}
                            options={ms.lookupFieldsOptions}
                            onchange={handleLookupFieldChange}
                          ></lightning-combobox>
                        </div>
                      </template>
                    </div>
                  </template>
                </template>

                <template if:false={field.mappedSources}>
                  <div class="fm-drop-hint">Drop here or select</div>
                </template>
              </article>
            </template>
          </div>
        </section>
      </div>

      <!-- Preview -->
      <div class="fm-preview slds-p-horizontal_medium slds-p-bottom_large">
        <div class="prev-title">Data Preview</div>
        <div class="prev-sub">
          Preview of mapped data with transformations applied
        </div>

        <div class="table-wrap">
          <table class="prev-table">
            <thead>
              <tr>
                <template if:true={hasMappedFields}>
                  <template for:each={mappedFields} for:item="f">
                    <th key={f.apiName}>{f.label}</th>
                  </template>
                </template>
              </tr>
            </thead>
            <tbody>
              <template if:true={hasClientPreview}>
                <template for:each={clientPreviewRows} for:item="row">
                  <tr key={row._key}>
                    <template for:each={row.cells} for:item="cell">
                      <td key={cell.key}>{cell.value}</td>
                    </template>
                  </tr>
                </template>
              </template>

              <template if:false={hasClientPreview}>
                <tr>
                  <td colspan={previewColspan} class="muted">
                    No preview available.
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Settings modal -->
    <template if:true={showSettingsModal}>
      <section class="fm-modal-backdrop" role="presentation">
        <div
          class="fm-modal"
          role="dialog"
          aria-modal="true"
          aria-label="Preview settings"
        >
          <header class="fm-modal__header">
            <h2>Preview settings</h2>
          </header>
          <div class="fm-modal__body">
            <lightning-input
              type="number"
              label="Number of preview rows"
              value={settingsPreviewRowLimit}
              min="1"
              max="50"
              onchange={handleSettingsRowLimitChange}
            ></lightning-input>
          </div>
          <footer class="fm-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleSettingsCancel}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label="Apply"
              onclick={handleSettingsApply}
            ></lightning-button>
          </footer>
        </div>
      </section>
    </template>
  </lightning-card>
</template>
