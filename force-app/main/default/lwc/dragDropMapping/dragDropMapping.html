<template>
  <lightning-card title="Field Mapping">
    <div class="mapping-container">
      <section class="panel sources" aria-label="Source columns">
        <h3>Source Columns</h3>
        <template if:true={sources}>
          <ul class="list" ondragover={handleDragOver} ondrop={handleDropOnSources}>
            <template for:each={sources} for:item="src">
              <li key={src.key}
                  class="draggable"
                  draggable="true"
                  data-key={src.key}
                  ondragstart={handleDragStart}
                  onkeydown={handleKeyDownStart}
                  tabindex="0"
                  role="listitem"
                  aria-grabbed="false">
                <span class="label">{src.label}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={sources}>
          <div class="empty">No source columns</div>
        </template>
      </section>

      <section class="panel targets" aria-label="Target fields">
        <h3>Targets</h3>
        <template if:true={targetsWithMapping}>
          <ul class="list">
            <template for:each={targetsWithMapping} for:item="t">
              <li key={t.apiName}
                  class="target"
                  data-api={t.apiName}
                  ondragover={handleDragOver}
                  ondrop={handleDropOnTarget}
                  tabindex="0"
                  role="listitem">
                <div class="target-label">{t.label}</div>
                <div class="mapped">
                  <template if:true={t.mappedSource}>
                    <span class="mapped-chip">{t.mappedSource.label}</span>
                    <button class="clear-btn" title="Clear mapping" data-api={t.apiName} onclick={clearMapping}>✕</button>
                  </template>
                  <template if:false={t.mappedSource}>
                    <span class="placeholder">Drop a source here</span>
                  </template>
                </div>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={targetsWithMapping}>
          <div class="empty">No targets</div>
        </template>
      </section>
    </div>

    <div class="slds-p-top_small slds-text-align_right">
      <lightning-button variant="brand" label="Save mappings" onclick={saveMappingsHandler}></lightning-button>
    </div>
  </lightning-card>
</template>
