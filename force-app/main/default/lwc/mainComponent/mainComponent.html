<template>
  <template if:true={isLoading}>
    <div class="slds-spinner_container">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
        variant="inverse"
      ></lightning-spinner>
    </div>
  </template>

  <div class="container" role="main" aria-label="ImportMate project interface">
    <header>
      <div class="sub-container">
        <div class="logo" aria-label="ImportMate logo">
          <lightning-icon
            style="margin-right: 20px"
            icon-name="utility:download"
            alternative-text="Utility download"
            title="download"
          ></lightning-icon>
          ImportMate
          <div class="stepper">
            <c-stepper-component
              current-step={currentStep}
              steps={steps}
              onstepchange={handleStepClick}
            >
            </c-stepper-component>
          </div>
        </div>

        <!-- Projects Workflow View -->
        <template if:false={showDashboard}>
          <div class="content-container">
            <!-- <div class="container"> -->
              <!-- Step 1: Project Setup -->

                <template if:true={showCreatorSection}>
                  <c-project-form-card-component
                    recent-projet={currentProject}
                    onsaveproject={handleCreateProject}
                    oncancel={handleCancel}
                    onprojectnamechange={handleProjectNameChange}
                    ondescriptionchange={handleDescriptionChange}
                    ontargetobjectchange={handleTargetObjectChange}
                  ></c-project-form-card-component>
                </template>

              <!-- Step 2: Data Source Selection -->
              <template if:true={showDataSourceSelection}>
                <c-data-source-selector-page
                  current-project={currentProject}
                  onsourceselected={handleDataSourceSelected}
                ></c-data-source-selector-page>
              </template>

              <!-- Step 2: CSV Uploader -->
              <template if:true={showCsvUploader}>
                <c-csv-uploader
                  current-project={currentProject}
                  oncsvloaded={handleCsvLoaded}
                  ongotomapping={handleStartMapping}
                  onprevious={handleBackToDataSourceSelection}
                ></c-csv-uploader>
              </template>

              <!-- Step 2: SOQL Builder -->
              <template if:true={showSoqlBuilder}>
                <c-soql-builder
                  project-target-object={mappingTargetObject}
                  onstartmapping={handleStartMapping}
                  onprevious={handleBackToDataSourceSelection}
                ></c-soql-builder>
              </template>

              <!-- Step 3 & 4: Field Mapping & Transformations -->
              <template if:true={isMappingAndTransformation}>
                <c-field-mapper
                  preselected-project-id={currentProject.Id}
                  preselected-target-object={mappingTargetObject}
                  source-columns-csv={mappingHeadersCsv}
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                ></c-field-mapper>
              </template>

              <!-- Step 4: Transformations -->
              <template if:true={isTransformations}>
                <!-- <c-transformation-cmp
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                ></c-transformation-cmp> -->
              </template>

              <!-- Step 5: Validation (Dry Run) -->
              <template if:true={isDryRunExecution}>
                <!-- <c-dry-run-validator
                  project-id={currentProject.Id}
                  csv-data={csvData}
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                ></c-dry-run-validator> -->
              </template>

              <!-- Step 6: Execution & scheduling-->
              <template if:true={isRealExecution}>
                <!-- <c-execution-cmp
                  project-id={currentProject.Id}
                  csv-data={csvData}
                  onprevious={handleBackToStep}
                ></c-execution-cmp> -->
              </template>
            <!-- </div> -->
          </div>
        </template>
      </div>
    </header>

    <template if:true={currentStep}>
      <!-- ===== Step 1: Start ===== -->
      <template if:true={isStart} aria-label="section start">
        <!-- Recent projects list -->
        <template
          if:false={showCreatorSection}
          aria-label="select project recent section"
        >
          <c-import-project-recent-component
            onshow={openNewProject}
            onselectproject={nagivateToSelectdDataSource}
            onsearchproject={handleFindExistingProject}
            projects={importProjects}
          >
          </c-import-project-recent-component>
        </template>

        <!-- New project creator -->
        <template
          if:true={showCreatorSection}
          aria-label="creation project section"
        >
          <c-create-project-component
            project-name={projectName}
            description={description}
            target-object={targetObject}
            onnamechange={handleProjectNameChange}
            ondescriptionchange={handleDescriptionChange}
            ontargetchange={handleTargetObjectChange}
            onsave={handleCreateProject}
            oncancel={handleCancel}
          >
          </c-create-project-component>
        </template>
      </template>

      <!-- ===== Step 2: Select source ===== -->
      <template if:true={isSelectSource} aria-label="select source section">
        <c-data-source-selector
          current-project={recentProject}
          onprevious={handlePreviousStep}
          onstartmapping={handleStartMapping}
          oncsvparsed={handleCsvParsed}
        >
        </c-data-source-selector>
      </template>

      <!-- ===== Step 3: Mapping & transformation ===== -->
      <template
        if:true={isMappingAndTransformation}
        aria-label="mapping & transformation section"
      >
       <c-field-mapper
          preselected-project-id={recentProject.Id}
          preselected-project-name={recentProject.Name} 
          preselected-target-object={mappingTargetObject}
          source-columns-csv={mappingHeadersCsv}
          csv-rows={mappingSampleRows}
          total-row-count={mappingTotalRowCount}
          source-label={mappingSourceLabel}
          onprevious={handleBackToStep2}>
      </c-field-mapper>

      </template>

      <!-- ===== Step 4: Scheduling ===== -->
      <template if:true={isScheduling} aria-label="schedule's section">
        <c-schedule-creator-component
          project-id={recentProject.Id}
          show-schedule={showSchedule}
          onselect={handleSelectedFrequency}
          onnextrunchange={handleNextRunChange}
          onadd={handleAddSchedule}
        >
        </c-schedule-creator-component>
      </template>
    </template>
  </div>
</template>
