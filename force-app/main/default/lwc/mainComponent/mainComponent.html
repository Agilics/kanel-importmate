<template>
  <template if:true={isLoading}>
    <div class="slds-spinner_container">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
        variant="inverse"
      >
      </lightning-spinner>
    </div>
  </template>

  <div class="app-wrapper">
    <!-- App Header -->
<!--     <c-app-header-cmp
      active-page={activePage}
      onnavigation={handleNavigation}
    ></c-app-header-cmp> -->

    <div class="app-layout" role="main" aria-label="ImportMate project interface">
      <!-- Sidebar -->
      <c-side-bar-cmp
        active-page={activePage}
        current-step={currentStep}
        steps={baseSteps}
        current-project={currentProject}
        onstepchange={handleSidebarStepClick}
        onquickaction={handleQuickAction}
      ></c-side-bar-cmp>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Dashboard View -->
        <template if:true={showDashboard}>
          <div class="content-container">
             <!-- <c-import-history onnewimportproject={openProjectForm}>
            </c-import-history> -->
            <c-dashboard-cmp
              onnewproject={openNewProject}
              onprojectselect={handleProjectSelect}
              onprojectedit={handleProjectSelect}
            ></c-dashboard-cmp>
          </div>
        </template>

        <!-- Projects Workflow View -->
        <template if:false={showDashboard}>
          <div class="content-container">
            <!-- <div class="container"> -->
              <!-- Step 1: Project Setup -->

                <template if:true={showCreatorSection}>
                  <c-project-form-component
                    recent-projet={currentProject}
                    onsaveproject={handleCreateProject}
                    oncancel={handleCancel}
                    onprojectnamechange={handleProjectNameChange}
                    ondescriptionchange={handleDescriptionChange}
                    ontargetobjectchange={handleTargetObjectChange}
                  ></c-project-form-component>
                </template>

              <!-- Step 2: Data Source Selection -->
              <template if:true={showDataSourceSelection}>
                <c-data-source-selector-page
                  current-project={currentProject}
                  onsourceselected={handleDataSourceSelected}
                  onprevious={handleBackToDataSourceSelection}
                ></c-data-source-selector-page>
              </template>

              <!-- Step 2: CSV Uploader -->
              <template if:true={showCsvUploader}>
                <c-csv-uploader
                  current-project={currentProject}
                  oncsvloaded={handleCsvLoaded}
                  ongotomapping={handleStartMapping}
                  onprevious={handleBackToDataSourceSelection}
                ></c-csv-uploader>
              </template>

              <!-- Step 2: SOQL Builder -->
              <template if:true={showSoqlBuilder}>
                <c-soql-builder
                  project-target-object={mappingTargetObject}
                  onstartmapping={handleStartMapping}
                  onprevious={handleBackToDataSourceSelection}
                ></c-soql-builder>
              </template>

              <!-- Step 3 & 4: Field Mapping & Transformations -->
              <template if:true={isMappingAndTransformation}>
                <c-field-mapper
                  preselected-project-id={currentProject.Id}
                  preselected-target-object={mappingTargetObject}
                  source-columns-csv={mappingHeadersCsv}
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                ></c-field-mapper>
              </template>

              <!-- Step 4: Transformations -->
            <template if:true={isTransformations}>
                <c-transformation-page
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                  project-id={currentProject.Id}
                ></c-transformation-page>
            </template>


              <!-- Step 5: Validation (Dry Run) -->
              <!-- <template if:true={isDryRunExecution}>
                <c-dry-run-validator
                  project-id={currentProject.Id}
                  csv-data={csvData}
                  onprevious={handleBackToStep}
                  onnext={handleNextStep}
                ></c-dry-run-validator>
              </template> -->

              <!-- Step 6: Execution & scheduling-->
              <!-- <template if:true={isRealExecution}>
                <c-execution-cmp
                  project-id={currentProject.Id}
                  csv-data={csvData}
                  onprevious={handleBackToStep}
                ></c-execution-cmp>
              </template> -->
            <!-- </div> -->
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
