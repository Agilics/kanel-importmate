<template>
    <section class="modal-backdrop">
        <div class="modal">
            <header class="modal__header">
                <h2>{modalTitle}</h2>
                <button type="button" class="modal-close-btn" onclick={handleCloseModal} title="Close">✕</button>
            </header>
            <div class="modal__body">
                <template if:true={hasPresetFile}>
                    <p class="preset-file-banner">📄 Fichier à importer : <strong>{presetFileName}</strong></p>
                </template>

                <div class="form-group">
                    <label class="form-label" for="freq">Frequency</label>
                    <select id="freq" class="rounded-input" onchange={handleFrequencyChange}>
                        <template for:each={picklistValuesWithSelected} for:item="o">
                            <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                        </template>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="time">Date &amp; Heure</label>
                    <input
                        id="time"
                        type="datetime-local"
                        class="rounded-input"
                        value={nextRun}
                        onchange={handleNextRunChange}
                    />
                </div>
            </div>

            <footer class="modal__footer">
                <button type="button" class="btn btn-secondary" onclick={handleCloseModal}>Cancel</button>
                <button type="button" class="btn btn-primary" onclick={handleAddSchedule}>{saveButtonLabel}</button>
            </footer>
        </div>
    </section>
</template>
