<template>
    <section class="modal-backdrop">
        <div class="modal">
            <header class="modal__header">
                <h2 class="slds-text-heading_medium">Add New Schedule</h2>
            </header>
            <div class="modal__body">
                <div class="form-group">
                    <label class="form-label" for="freq">Frequency</label>
                    <lightning-combobox
                        id="freq"
                        class="rounded-input"
                        name="frequency"
                        value={selectedFrequency}
                        options={picklistValues}
                        onchange={handleFrequencyChange}
                        variant="label-hidden"
                    ></lightning-combobox>
                </div>

                <div class="form-group">
                    <label class="form-label" for="time">Time</label>
                    <lightning-input id="time" class="rounded-input" type="datetime" value={nextRun} onchange={handleNextRunChange}
                        variant="label-hidden"></lightning-input>
                </div>
            </div>

            <footer class="modal__footer">
                <button class="btn btn-secondary" onclick={handleCloseModal}>
                   <label>Cancel</label>
                </button>
                <button class="btn btn-primary" onclick={handleAddSchedule}>
                    <label>Add Schedule</label>
                </button>
            </footer>
        </div>
    </section>
</template>
