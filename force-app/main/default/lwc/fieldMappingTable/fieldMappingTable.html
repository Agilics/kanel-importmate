<template>
  <div class="fmt-shell">
    <!-- Status bar -->
    <div class="fmt-status-bar" role="status">
      <span class="fmt-status-icon">ℹ</span>
      <span>{statusText}</span>
    </div>

    <!-- Spinner -->
    <template if:true={isBusy}>
      <div class="fmt-spinner-wrap">
        <div class="aurora-spinner"></div>
      </div>
    </template>

    <!-- Top controls: Target Object • Project • Version -->
    <div class="fmt-controls">
      <div class="fmt-control-item">
        <label class="fmt-label">Target Object</label>
        <select class="rounded-input" onchange={handleObjectPick}>
          <option value="">Select an object</option>
          <template for:each={objectOptionsWithSelected} for:item="o">
            <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
          </template>
        </select>
      </div>

      <div class="fmt-control-item">
        <label class="fmt-label">Project</label>
        <select class="rounded-input" onchange={handleProjectPick}>
          <option value="">Select a project</option>
          <template for:each={projectOptionsWithSelected} for:item="o">
            <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
          </template>
        </select>
      </div>

      <div class="fmt-control-item">
        <label class="fmt-label">Version</label>
        <input type="text" class="rounded-input" value={selectedVersion} onchange={handleVersionChange} />
      </div>
    </div>

    <!-- Mapping grid -->
    <template if:true={hasColumns}>
      <div class="fmt-section-label">
        Map CSV columns to {selectedObjectApiName}
      </div>

      <div class="fmt-table-wrap">
        <table class="fmt-table">
          <thead>
            <tr>
              <th>CSV Column</th>
              <th>Target Field</th>
              <th style="width:90px">Lookup?</th>
              <th>Lookup Object</th>
              <th>Match Field</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={rowsWithOptions} for:item="r">
              <tr key={r.key}>
                <td class="fmt-col-source">{r.sourceColumn}</td>

                <td>
                  <select class="rounded-input fmt-select" data-key={r.key} onchange={handleFieldPick}>
                    <template for:each={r.targetFieldOpts} for:item="o">
                      <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                    </template>
                  </select>
                </td>

                <td class="fmt-col-center">
                  <input
                    type="checkbox"
                    class="fmt-checkbox"
                    data-key={r.key}
                    checked={r.isLookup}
                    onchange={handleLookupToggle}
                  />
                </td>

                <td>
                  <select class="rounded-input fmt-select" data-key={r.key}
                    disabled={r.disabledLookup} onchange={handleLookupObjectPick}>
                    <option value="">Select object</option>
                    <template for:each={r.lookupObjectOpts} for:item="o">
                      <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                    </template>
                  </select>
                </td>

                <td>
                  <select class="rounded-input fmt-select" data-key={r.key}
                    disabled={r.disabledLookup} onchange={handleLookupMatchFieldPick}>
                    <option value="">Field on lookup object</option>
                    <template for:each={r.lookupMatchFieldOpts} for:item="o">
                      <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                    </template>
                  </select>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="fmt-actions">
        <button type="button" class="btn btn-primary" onclick={handleSave} disabled={isSaveDisabled}>
          Save mappings
        </button>
        <button type="button" class="btn btn-secondary" onclick={handleLoadExisting} disabled={disableLoad}>
          Load existing
        </button>
      </div>
    </template>

    <template if:false={hasColumns}>
      <p class="fmt-empty">
        Upload a CSV (or provide columns) to start mapping.
      </p>
    </template>
  </div>
</template>
