<template>
  <!-- text title with buttons-->
  <div class="main-sub pb-1">
    <div class="title">
      <h1>Import Scheduling</h1>
      <p class="subtitle">
        Set up recurring import schedules and manage scheduled jobs
      </p>
    </div>
    <div class="btn-header">
    <!--<button class="btn btn-primary">                New Schedule</button>-->  <button class="btn btn-primary">                New Schedule</button>
      <button type="button" class="btn btn-execute" onclick={handleExecuteNow} disabled={isExecuteDisabled} title="Créer une exécution pour chaque planification du projet">
        {executeButtonLabel}
      </button>
    </div>
  </div>
  <!-- text title with buttons end-->
  <div class="main px-3">
    <div class="card">
      <div class="head p-1">
        <!-- icon & title-->
        <div class="card-header">
          <span class="custom-icon-date_input">                      </span>
          <h2 class="card-title">Schedule Configuration</h2>
        </div>
      </div>

      <!-- separator-->
      <hr class="separator" />

      <!-- form content -->
      <div class="card-content p-1">
        <!-- frequency settings -->
        <div class="settings">
          <h3 class="frequency-settings-title">Frequency Settings</h3>
          <div class="zone">
            <select class="frequency-combobox rounded-input" id="frequency" onchange={handleFrequencyChange}>
              <template for:each={picklistValuesWithSelected} for:item="o">
                <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
              </template>
            </select>
          </div>

          <!-- Next Run date time picker  on local area -->
          <div class="zone">
            <input
              type="datetime-local"
              class="time-input rounded-input"
              id="time"
              value={nextRun}
              onchange={handleNextRunChange}
            />
          </div>
          <!--                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                          l        ment 3 : Source des donn        es pour l'import planifi        
               Valeurs: Inherit (h        riter) / Criteria (crit        res) / Fixed (fixe)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 -->
          <div class="zone file-source-zone">
            <div class="file-source-label-uc">3           Source des donn        es</div>
            <select class="rounded-input" onchange={handleFileModeChange}>
              <template for:each={fileModeOptionsWithSelected} for:item="o">
                <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
              </template>
            </select>

            <!--                                           l        ment 4 : Mode Inherit (h        rit        )                                -->
            <template if:true={isInheritMode}>
              <p class="sched-summary-text">Les imports planifi        s utiliseront la m        me source de donn        es et les m        mes mappings que les         tapes pr        c        dentes.</p>
            </template>

            <!--                                Mode Fixed (fichier fixe)                                -->
            <template if:true={isFixedMode}>
              <div class="sched-file-opts">
                <div class={fixedFileOptClass} data-value="fixed" onclick={handleFileSourceChange}>
                  <span class="sfo-icon">                      </span>
                  <div>
                    <div class="sfo-title">Fichier fixe</div>
                    <div class="sfo-sub">{selectedFileName}</div>
                  </div>
                </div>
              </div>
              <template if:true={isFixedFile}>
                <template if:true={hasStoredFiles}>
                  <select class="rounded-input" onchange={handleStoredFileSelect}>
                    <option value="" disabled>Choisir un fichier...</option>
                    <template for:each={storedFileOptionsWithSelected} for:item="o">
                      <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                    </template>
                  </select>
                </template>
                <template if:false={hasStoredFiles}>
                  <p class="no-files-msg">Aucun fichier CSV trouv         pour ce projet. Uploadez-en un          l'        tape 2 d'abord.</p>
                </template>
              </template>
            </template>

            <!--                                Mode Criteria :            l        ments 5          10                                -->
            <template if:true={isCriteriaMode}>
              <div class="criteria-section">

                <!--                                           l        ment 5 : Type de fichier                                -->
                <div class="zone">
                  <div class="file-source-label-uc">5           Type de fichier</div>
                  <select class="rounded-input" onchange={handleFileTypeChange} >
                    <option value="">Choisir un type...</option>
                    <template for:each={fileTypeOptionsWithSelected} for:item="o">
                      <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                    </template>
                  </select>
                </div>

                <!--                                           l        ment 6 : Si plusieurs fichiers correspondent                                -->
                <div class="zone">
                  <div class="file-source-label-uc">6           Si plusieurs fichiers correspondent</div>
                  <div class="sched-radio-group">
                    <template for:each={selectionModeOptionsWithSelected} for:item="o">
                      <label key={o.value} class="sched-radio-label">
                        <input type="radio" name="selectionMode" value={o.value}
                               checked={o.isSelected}
                               onchange={handleSelectionModeChange} />
                        <span class="sched-radio-text">{o.label}</span>
                      </label>
                    </template>
                  </div>
                </div>

                <!--                                           l        ment 7 : Mod        le de nom de fichier                                -->
                <div class="zone">
                  <div class="file-source-label-uc">7           Mod        le de nom de fichier</div>
                  <input type="text" class="rounded-input" value={patternName}
                         oninput={handlePatternInput}
                         placeholder="ex: ventes_{yyyy-MM-dd}.csv" />
                </div>

                <!--                                           l        ment 8 : Boutons raccourcis de saisie                                -->
                <div class="zone">
                  <div class="file-source-label-uc">8           Raccourcis</div>
                  <div class="sched-shortcuts">
                    <button type="button" class="btn btn-sm" onclick={handleDateShortcut} title="Ajouter la date du jour">                       Date</button>
                    <button type="button" class="btn btn-sm" onclick={handleWildcardShortcut} title="N'importe quoi">* Tout</button>
                    <button type="button" class="btn btn-sm" onclick={handleCharShortcut} title="Un seul caract        re">? Caract        re</button>
                  </div>
                </div>

                <!--                                           l        ment 9 : Aper        u du nom recherch         aujourd'hui                                -->
                <template if:true={resolvedPattern}>
                  <div class="zone">
                    <div class="file-source-label-uc">9           Aper        u du nom recherch         aujourd'hui</div>
                    <div class="sched-preview-box">
                      <code class="sched-preview-code">{resolvedPattern}</code>
                    </div>
                  </div>
                </template>

              </div>
            </template>

            <!--                                           l        ment 10 : R        sum         en langage clair                                -->
            <template if:true={summaryText}>
              <div class="sched-summary-banner">
                <span class="sb-icon">               </span>
                <span class="sb-text">{summaryText}</span>
              </div>
            </template>

          </div>
        </div>
        <template if:false={isFixedFile}>

</template>
<!--end frequency settings-->
        <!-- schedule preview  -->
        <div class="box">
          <div class="schedule-preview">
            <h3 class="frequency-settings-title">Schedule Preview</h3>
            <div class="bloc">
              <div class="card-info px-1">
                <div class="info-header">
                  <span class="custom-icon-info">               </span>
                  <!-- title -->
                  <h4 class="info-title">Next Execution</h4>
                  <!--title end-->
                </div>

                <!--card info : content next execution day -->
                <div class="box-execution">
                  <h3 class="next-execution-day">{nextExecution}</h3>
                  <p class="recurrency">Recurring daily</p>
                </div>
                <!-- end next execution day -->
              </div>
            </div>
          </div>

          <div class="upcomings pt-1">
            <h3 class="upcoming-title">Upcoming Executions</h3>
            <!--List of upcoming executions date time-->
            <template for:each={upcomingExecution} for:item="item">
              <div key={executionDate}>
                <ul class="upcoming-item">
                  <li class="upcoming-date"></li>
                </ul>
              </div>
            </template>
          </div>
        </div>

        <!--end schedule preview -->
      </div>

      <!-- end form content -->

      <!-- separator-->
      <div class="separator footer-separator plr-1"></div>
      <!-- footer -->
      <div class="plr-1" style="display:flex;justify-content:space-between;align-items:center;padding-bottom:1.25rem;padding-top:1rem;">
        <div class="checkbox">
          <label class="scc-check-label"><input type="checkbox" /> Send email notifications</label>
          <label class="scc-check-label"><input type="checkbox" /> Auto-retry on failure</label>
        </div>
        <button type="button" class="btn btn-primary" onclick={handleAddSchedule} disabled={disabled}>Save Schedule</button>
      </div>

      <!-- footer end-->
    </div>

    <!-- end card -->
  </div>

      </div>
    </section>
  </div>-->
</template>
