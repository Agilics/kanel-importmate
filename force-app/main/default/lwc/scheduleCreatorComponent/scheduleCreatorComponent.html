<template>
  <div class="scc-card">
    <div class="scc-row">
      <div class="form-group">
        <label class="form-label"><span class="field-num">1</span>Fréquence</label>
        <select class="rounded-input" id="frequency" onchange={handleFrequencyChange}>
          <template for:each={picklistValuesWithSelected} for:item="o">
            <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
          </template>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="field-num">2</span>Date et heure de début</label>
        <input
          type="datetime-local"
          class="rounded-input"
          id="time"
          value={nextRun}
          onchange={handleNextRunChange}
        />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label"><span class="field-num">3</span>Source des données pour l'import planifié</label>
      <div class="sched-file-opts">
        <div class={inheritOptClass} data-value="Inherit" onclick={handleDataSourceModeChange}>
          <span class="sfo-radio"></span>
          <span class="sfo-icon">🔁</span>
          <div>
            <div class="sfo-title">Réutiliser la source des étapes précédentes</div>
            <div class="sfo-sub">Même fichier à chaque exécution.</div>
          </div>
        </div>
        <div class={criteriaOptClass} data-value="Criteria" onclick={handleDataSourceModeChange}>
          <span class="sfo-radio"></span>
          <span class="sfo-icon">🔎</span>
          <div>
            <div class="sfo-title">Sélectionner un fichier par critères</div>
            <div class="sfo-sub">Choix automatique selon un modèle de nom.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mode Criteria : panneau de construction du motif (éléments 5 à 10) -->
    <template if:true={isCriteriaMode}>
      <c-file-criteria-builder
        pattern={criteriaPattern}
        selection-mode={criteriaSelectionMode}
        project-id={projectId}
        start-number={criteriaStartNumber}
        onpatternchange={handleCriteriaPatternChange}
        onselectionmodechange={handleCriteriaSelectionModeChange}
      ></c-file-criteria-builder>
    </template>

    <!-- Mode Inherit : bandeau d'information (élément 4) -->
    <template if:true={isInheritMode}>
      <div class="form-group">
        <label class="form-label"><span class="field-num">4</span>État « Inherit » (à la place du panneau ci-dessus)</label>
        <p class="no-files-msg">
          Les imports planifiés utiliseront la même source de données et les transformations
          configurées aux étapes précédentes.
        </p>
      </div>
    </template>

    <!-- Mapping des champs — ajout propre à ImportMate, hors numérotation de la fiche UI :
         toujours visible, indépendant du mode Inherit/Criteria. Un import (immédiat ou
         planifié) sans mapping ne produit que des enregistrements vides. -->
    <div class="form-group mapping-extra">
      <label class="form-label"><span class="field-icon">🗺️</span>Mapping des champs</label>
      <div class="mapping-status-row">
        <span class={mappingBadgeClass}>{mappingBadgeLabel}</span>
        <button type="button" class="btn btn-outline btn-sm" onclick={handleOpenMappingModal}>
          Mapper les champs
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick={handleOpenTransformationModal}
                disabled={isTransformationDisabled} title={transformationButtonTitle}>
          Ajouter une transformation
        </button>
      </div>
    </div>

    <div class="scc-footer">
      <button type="button" class="btn btn-primary" onclick={handleAddSchedule}
              disabled={isSaveDisabled} title={saveButtonTitle}>
        {saveButtonLabel}
      </button>
    </div>
  </div>

  <!-- Modale "Mapper les champs" — hors de .scc-card à dessein : une animation avec transform
       sur un ancêtre créerait un containing block pour ce position:fixed et piégerait la
       modale dans les limites de la carte au lieu de couvrir tout l'écran. -->
  <template if:true={showMappingModal}>
    <section class="modal-backdrop">
      <div class="modal modal--wide">
        <header class="modal__header">
          <h2>🗺️ Mapping des champs</h2>
          <button type="button" class="modal-close-btn" onclick={handleCloseMappingModal} title="Fermer">✕</button>
        </header>
        <div class="modal__body">
          <!-- Aucun fichier en mémoire (étape Scheduling ouverte directement) : l'utilisateur
               choisit un fichier déjà chargé pour ce projet afin d'en récupérer les colonnes. -->
          <template if:false={hasEffectiveCsvData}>
            <div class="mapping-file-picker">
              <div class="mapping-file-picker-title">
                Choisissez un fichier de ce projet pour récupérer ses colonnes à mapper
              </div>
              <template if:true={isLoadingProjectFiles}>
                <p class="info">Chargement des fichiers…</p>
              </template>
              <template if:false={isLoadingProjectFiles}>
                <template if:true={hasProjectFiles}>
                  <div class="mapping-file-list">
                    <template for:each={projectFiles} for:item="f">
                      <div key={f.contentDocumentId}
                           class={f.rowClass}
                           data-id={f.contentDocumentId}
                           data-name={f.fileName}
                           onclick={handleSelectMappingFile}>
                        <span class="sf-icon">📄</span>
                        <span class="mapping-file-name">{f.fileName}</span>
                        <span class={f.statusClass}>{f.statusLabel}</span>
                      </div>
                    </template>
                  </div>
                </template>
                <template if:false={hasProjectFiles}>
                  <p class="no-files-msg">
                    Aucun fichier CSV trouvé pour ce projet. Chargez-en un depuis l'étape
                    Source des données, puis revenez ici pour le mapper.
                  </p>
                </template>
              </template>
            </div>
          </template>

          <template if:true={hasEffectiveCsvData}>
            <c-field-mapper
              preselected-project-id={projectId}
              preselected-target-object={targetObject}
              source-columns-csv={effectiveSourceColumnsCsv}
              csv-data={effectiveCsvData}
              onprevious={handleCloseMappingModal}
              oncontinue={handleCloseMappingModal}
            ></c-field-mapper>
          </template>
        </div>
      </div>
    </section>
  </template>

  <!-- Modale "Transformation" — proposée juste après un mapping fraîchement complété.
       Hors de .scc-card pour la même raison que la modale de mapping ci-dessus. -->
  <template if:true={showTransformationModal}>
    <section class="modal-backdrop">
      <div class="modal modal--wide">
        <header class="modal__header">
          <h2>⚙️ Transformation des données</h2>
          <button type="button" class="modal-close-btn" onclick={handleCloseTransformationModal} title="Fermer">✕</button>
        </header>
        <div class="modal__body">
          <c-transformation-page
            project-id={projectId}
            project-name={projectName}
            onprevious={handleCloseTransformationModal}
            onnext={handleCloseTransformationModal}
          ></c-transformation-page>
        </div>
      </div>
    </section>
  </template>
</template>
