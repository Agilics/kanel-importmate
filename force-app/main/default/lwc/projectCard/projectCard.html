<template>
  <div class="project-card" onclick={handleCardClick}>

    <!-- Edit / Delete (hidden, shown on hover) -->
    <div class="card-actions">
      <button class="card-act-btn" title="Edit" onclick={handleEditClick}>✎</button>
      <button class="card-act-btn del" title="Delete" onclick={handleDeleteClick}>🗑</button>
    </div>

    <!-- Name + object badge -->
    <div class="project-top">
      <div class="project-name">{projectName}</div>
      <span class="project-object">{targetObject}</span>
    </div>

    <!-- Progress bar (only when > 0) -->
    <template if:true={hasProgress}>
      <div>
        <div class="progress-label">
          <span>{labels.progress}</span>
          <span>{progressPercentage}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style={progressStyle}></div>
        </div>
      </div>
    </template>

    <!-- Footer: status · date · action -->
    <div class="project-footer">
      <span class={statusClass}>{statusLabel}</span>
      <span class="project-meta">{lastModifiedDate}</span>
      <span class="project-action">Ouvrir →</span>
    </div>

  </div>
</template>
