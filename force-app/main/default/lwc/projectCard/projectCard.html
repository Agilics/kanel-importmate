<template>
    <div class="project-card" onclick={handleCardClick}>
        <!-- Card Header -->
        <div class="card-header">
            <div class="card-header-left">
                <h3 class="project-title">{projectName}</h3>
                <span class={statusClass}>{status}</span>
            </div>
            <div class="card-header-right">
                <lightning-button-icon
                    icon-name="utility:edit"
                    alternative-text="Edit"
                    title="Edit Project"
                    size="small"
                    variant="bare"
                    onclick={handleEditClick}
                    class="action-icon">
                </lightning-button-icon>
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Delete"
                    title="Delete Project"
                    size="small"
                    variant="bare"
                    onclick={handleDeleteClick}
                    class="action-icon">
                </lightning-button-icon>
            </div>
        </div>

        <!-- Card Body -->
        <div class="card-body">
            <p class="project-description">{description}</p>
            
            <div class="project-meta">
                <div class="meta-item">
                    <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                    <span class="meta-label">{labels.target}</span>
                    <span class="meta-value">{targetObject}</span>
                </div>
                <div class="meta-item">
                    <lightning-icon icon-name="standard:record" size="x-small"></lightning-icon>
                    <span class="meta-label">{labels.records}</span>
                    <span class="meta-value">{recordCount}</span>
                </div>
                <div class="meta-item">
                    <lightning-icon icon-name="standard:date_time" size="x-small"></lightning-icon>
                    <span class="meta-label">{labels.lastModified}</span>
                    <span class="meta-value">{lastModifiedDate}</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <template if:true={hasProgress}>
                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-label">{labels.progress}</span>
                        <span class="progress-percentage">{progressPercentage}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style={progressStyle}></div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>
