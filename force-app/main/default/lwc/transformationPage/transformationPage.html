<template>
   <div class="main">
      <div class="header">
         <div class="text-header">
            <h1 class="header-title">Data Transformations</h1>
            <p class="subtitle">Set up your data import project</p>
         </div>
         <!-- Button  -->
      </div>
      <!-- Mapper List  for selected project--> 
      <c-transformation-mapper-list 
            project-id={projectId}
            onaddtransformation={handleAddTransformation}>
      </c-transformation-mapper-list>

      <template if:true={isTransformation}>
         <!-- Tabs transformation select -->
         <div style="margin-top:4rem;">
            <c-transformation-field-tabs
               active-tab={activeTransformationTab}
               onmovetransformation={handleTransformationChange}
               >
            </c-transformation-field-tabs>
         </div>
         <!-- End tabs transformation select -->
         <!-- Liste des transformations -->  
         <template for:each={pagedTransformations} for:item="t">
            <c-transformation-card-component 
               key={t.id} 
               rule-id={t.id} 
               card-head-title={t.displayTitle}
               card-head-subtitle={t.displaySubtitle} 
               icon-name={t.iconName} 
               icon-box-class={t.iconBoxClass}
               head-icon-class={t.headIconClass} 
               onruledelete={handleTransformationDelete}
               onedittransformation={handleEditTransformation}>
            </c-transformation-card-component>
         </template>
         <!--End List of transformations --> 
         <!-- Pagination -->
      <c-paginator-component 
         items={filteredTransformations}
         page-size={pageSize} 
         page-index={pageIndex}
         onpagechange={handlePageChange}>
      </c-paginator-component>
         <!-- End Pagination --> 
      </template>
      <!-- No transformation rule-->
      <template if:false={hasTransformations}>
         <div class="no-rule-container">
            <lightning-icon icon-name="custom:custom19" size="large" class="no-rule-icon"></lightning-icon>
            <p class="no-rule-message">No transformation added yet. </p>
         </div>
      </template>
      <footer class="footer-container">
         <div class="footer-separator"></div>
         <div class="footer-actions">
            <button class="btn btn-secondary" onclick={handleBackToMapping}>
               <lightning-icon icon-name="utility:back" size="x-small"></lightning-icon>
               <label>Back to Mapping</label>
            </button>
            <div class="btns">
               <button class="btn btn-secondary" onclick={handleBackToMapping}>
               Save as Template
               </button>
               <button class="btn btn-primary" onclick={handleNextStep}  >
                  Continue to Validation
                  <lightning-icon class="icon-inline custom-icon-output" icon-name="standard:output" size="small"></lightning-icon>
               </button>
            </div>
         </div>
      </footer>
   </div>
</template>
