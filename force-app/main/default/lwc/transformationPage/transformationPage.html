<!--
   @description       : TransformationPage - HTML template with Custom Labels integration
   @author            : Mouhamed NIANG
   @last modified on  : 02-24-2026
-->
<template>
   <div class="main">
      <div class="header">
         <div class="text-header">
            <h1 class="header-title">{labels.title}</h1>
            <p class="subtitle">{labels.subtitle}</p>
         </div>
         <span class="badge">{projectName}</span>
         <!-- Button  -->
      </div>
      <!-- Mapper List for selected project --> 
      <div class="content">
         <c-transformation-mapper-list 
            project-id={projectId}
            onaddtransformation={handleAddTransformation}>
         </c-transformation-mapper-list>
      </div>

      <template if:true={isTransformation}>
         <!-- Tabs transformation select -->
         <div style="margin-top:12px;">
            <c-transformation-field-tabs
               active-tab={activeTransformationTab}
               onmovetransformation={handleTransformationChange}>
            </c-transformation-field-tabs>
         </div>
         <!-- End tabs transformation select -->

         <!-- Liste des transformations -->  
         <template for:each={pagedTransformations} for:item="t">
            <c-transformation-card-component 
               key={t.id} 
               rule-id={t.id} 
               card-head-title={t.displayTitle}
               card-head-subtitle={t.displaySubtitle} 
               icon-name={t.iconName} 
               icon-box-class={t.iconBoxClass}
               head-icon-class={t.headIconClass}
               order={t.order}
               target-field={t.targetField}
               rule-type={t.ruleType} 
               status={status}
               onruledelete={handleTransformationDelete}
               onedittransformation={handleEditTransformation}>
            </c-transformation-card-component>
         </template>
         <!-- End List of transformations --> 

         <!-- Pagination -->
         <c-paginator-component 
            items={filteredTransformations}
            page-size={pageSize} 
            page-index={pageIndex}
            onpagechange={handlePageChange}>
         </c-paginator-component>
         <!-- End Pagination --> 
      </template>


      <footer class="footer-container">
         <div class="footer-separator"></div>
         <div class="footer-actions">
            <button class="btn btn-secondary" onclick={handleBackToMapping}>← {labels.backToMapping}</button>
            <div class="btns">
               <button class="btn btn-secondary" onclick={handleBackToMapping}>{labels.saveAsTemplate}</button>
               <button class="btn btn-primary" onclick={handleNextStep}>{labels.continueToValidation} →</button>
            </div>
         </div>
      </footer>
   </div>
</template>
