<!--
  @description       : Project FORM component hosting inputs from project form
  @author            : ChangeMeIn@UserSettingsUnder.SFDoc
  @group             : 
  @last modified on  : 02-25-2026
  @last modified by  mouhamed niang
  @Last Modification : refactoring du formulaire en responsive design
-->
<template>
   <div class={containerClass}>
      <!-- Header : création seulement -->
      <template if:false={openModal}>
         <div class="header">
            <lightning-icon icon-name="utility:add" alternative-text="Add" class="plus-icons margin-icon"></lightning-icon>
            <div class="text-header">
               <h1>New Project</h1>
               <p class="subtitle">Set up your data import project with target object and configuration</p>
            </div>
         </div>
      </template>
      <section class={contentClass}>
         <div class="project-info">
            <!-- Section header : création seulement -->
            <template if:false={openModal}>
               <div class="section-header">
                  <lightning-icon icon-name="utility:info" alternative-text="Info" class="icon-colors"></lightning-icon>
                  <h2>Project Information</h2>
               </div>
            </template>
            <div class="form-group">
               <label class="custom-label name-label" for="project-name">
               Project Name <span class="required">*</span>
               </label>
               <lightning-input
                  id="project-name"
                  class="rounded-input"
                  style="width: 100%"
                  type="text"
                  value={projectName}
                  placeholder="Enter a descriptive project name"
                  onchange={handleProjectNameChange}>
               </lightning-input>
               <p class="help-text">Choose a clear, descriptive name for easy identification</p>
            </div>
            <label class="custom-label mb-1 description-label">Description</label>
            <lightning-textarea
               class="input-field rounded-input"
               style="margin-top: -1.6rem;"
               value={description}
               placeholder="Describe the purpose and scope of this import project..."
               onchange={handleDescriptionChange}>
            </lightning-textarea>
            <p class="help-text">Provide details about data source, business purpose, and expected outcomes</p>
         </div>
         <!-- Divider : création seulement -->
         <template if:false={openModal}>
            <hr class="divider" />
         </template>
         <div class="target-object-config">
            <!-- Section header : création seulement -->
            <template if:false={openModal}>
               <div class="section-header">
                  <lightning-icon icon-name="utility:campaign" alternative-text="Campaign" class="icon-colors"></lightning-icon>
                  <h2>Target Object Configuration</h2>
               </div>
            </template>
            <div class="form-grid">
               <div class="form-item">
                  <label class="custom-label target-label">
                  Target Salesforce Object <span class="required">*</span>
                  </label>
                  <lightning-combobox
                     value={targetObject}
                     options={options}
                     class="rounded-input"
                     onchange={handleTargetObjectChange}>
                  </lightning-combobox>
                  <p class="help-text">Select the Salesforce object where data will be imported</p>
               </div>
            </div>
         </div>
         <c-project-form-footer-component
            onsave={handleCreateProject}
            oncancel={handleCancel}>
         </c-project-form-footer-component>
      </section>
   </div>
</template>
