<template>
  <!-- header -->
  <div class="header">
    <div class={boxIconClass}>
      <span class="ec-icon">{iconEmoji}</span>
    </div>
    <div class="text-content">
      <h3 class="title">{titleCard}</h3>
      <p class="txt subtitle">{subtitleCard}</p>
    </div>
  </div>

  <!-- Immediate execution -->
  <template if:false={showScheduledCard}>
    <div class="ec-form">
      <!-- Execution mode -->
      <div class={formGroup}>
        <label class="ec-label">{labels.labelExecutionMode}</label>
        <select class="ec-select" onchange={handleModeChange}>
          <template for:each={modeOptionsWithSelected} for:item="o">
            <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
          </template>
        </select>
      </div>

      <!-- Batch size -->
      <div class={formGroup}>
        <label class="ec-label">{labels.labelBatchSize}</label>
        <input type="number" class="ec-input" name="batch-size"
          min="1" max="2000" step="1" value={batchSize}
          placeholder="e.g. 200" onchange={handleBatchSizeChange} />
        <p class="batch-size-hint">Recommended: 50–500. Leave blank to use the project default.</p>
      </div>

      <!-- Email notification checkbox -->
      <label class="ec-check-label">
        <input type="checkbox" checked={sendEmailNotification} onchange={handleEmailNotificationChange} />
        {labels.labelSendEmail}
      </label>
    </div>
  </template>

  <!-- Scheduled execution -->
  <template if:true={showScheduledCard}>
    <div class="schedule-panel">
      <div class="sched-form">
        <div class="sched-field">
          <label class="sched-label">{labels.labelFrequency}</label>
          <select class="ec-select sched-combobox" onchange={handleFrequencyChange}>
            <template for:each={frequencyOptionsWithSelected} for:item="o">
              <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
            </template>
          </select>
        </div>
        <div class="sched-field">
          <label class="sched-label">{labels.labelStartDate}</label>
          <input type="datetime-local" class="ec-input sched-datetime"
            value={nextRun} onchange={handleNextRunChange} />
        </div>
      </div>
      <template if:true={labels.scheduledImportNote}>
        <div class="sched-note">{labels.scheduledImportNote}</div>
      </template>
    </div>
  </template>
</template>
