<template>
  <div class="validation-container">
    <!-- Header -->
    <div class="page-header">
      <div class="header-content">
        <div class="header-left">
          <div class="header-row">
            <h1 class="header-title">Data Validation</h1>

            <template if:true={validationExecuted}>
              <template if:true={hasErrors}>
                <span class="error-status-badge">
                  <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                  Validation completed with errors
                </span>
              </template>
              <template if:false={hasErrors}>
                <span class="error-status-badge success-badge">
                  <lightning-icon icon-name="utility:success" size="xx-small"></lightning-icon>
                  Validation completed successfully
                </span>
              </template>
            </template>
          </div>

          <p class="header-subtitle">Review and fix data issues before import</p>
        </div>

        <div class="header-right">
          <lightning-button
            label="Run Validation"
            onclick={runDryRun}
            disabled={isDryRunDisabled}
            variant="brand"
            icon-name="utility:play"
            icon-position="left">
          </lightning-button>

          <lightning-button
            label="Export Report"
            onclick={exportErrors}
            disabled={isExportDisabled}
            variant="neutral"
            icon-name="utility:download"
            icon-position="left"
            class="slds-m-left_x-small">
          </lightning-button>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <template if:true={importStatus}>
      <div class="validation-progress-section">
        <div class="progress-header">
          <div class="progress-header-left">
            <h2 class="progress-title">Validation Progress</h2>

            <template if:true={isImportInProgress}>
              <span class="status-badge in-progress">
                <span class="status-dot"></span>
                Validation in progress
              </span>
            </template>

            <template if:true={isImportCompleted}>
              <span class="status-badge completed">
                <span class="status-dot"></span>
                Completed
              </span>
            </template>

            <template if:true={isImportFailed}>
              <span class="status-badge failed">
                <span class="status-dot"></span>
                Failed
              </span>
            </template>
          </div>

          <div class="progress-header-right">
            <template if:true={isImportInProgress}>
              <lightning-button
                label="Cancel Validation"
                variant="destructive-text"
                icon-name="utility:close"
                icon-position="left"
                onclick={handleCancelValidation}>
              </lightning-button>
            </template>
          </div>
        </div>

        <div class="progress-content">
          <div class="progress-bar-container">
            <div class="progress-info">
              <span class="progress-numbers">
                {processedCount} of {totalRecordsToProcess} records ({importProgressPercentage}%)
              </span>
            </div>

            <lightning-progress-bar value={importProgressPercentage} variant={progressBarVariant} size="large"></lightning-progress-bar>
          </div>

          <div class="statistics-grid">
            <div class="stat-card stat-success">
              <div class="stat-number">{validCount}</div>
              <div class="stat-label">Validated</div>
              <div class="stat-percentage">{validPercentage}%</div>
            </div>

            <div class="stat-card stat-processing">
              <div class="stat-number">{processingCount}</div>
              <div class="stat-label">Processing</div>
              <div class="stat-percentage">{processingPercentage}%</div>
            </div>

            <div class="stat-card stat-error">
              <div class="stat-number">{failedCount}</div>
              <div class="stat-label">Failed</div>
              <div class="stat-percentage">{failedPercentage}%</div>
            </div>

            <div class="stat-card stat-remaining">
              <div class="stat-number">{remainingCount}</div>
              <div class="stat-label">Remaining</div>
              <div class="stat-percentage">{remainingPercentage}%</div>
            </div>
          </div>

          <template if:true={importMessage}>
            <div class="message-box">
              <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
              <span>{importMessage}</span>
            </div>
          </template>

          <template if:true={currentExecutionId}>
            <div class="execution-id">
              <span>Execution ID:</span>
              <code>{currentExecutionId}</code>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Validation Report -->
    <template if:true={showValidationSection}>
      <template if:true={validationExecuted}>
        <template if:true={hasIssues}>
          <div class="error-details-section">
            <h2 class="results-title">Validation Report</h2>

            <div class="error-filters">
              <div class="error-tabs">
                <button class={errorsTabClass} data-tab="errors" onclick={handleTabClick}>
                  <span class="error-tab-badge">Errors ({errorsCount})</span>
                </button>

                <button class={warningsTabClass} data-tab="warnings" onclick={handleTabClick}>
                  <span class="error-tab-badge">Warnings ({warningsCount})</span>
                </button>

                <button class={allTabClass} data-tab="all" onclick={handleTabClick}>
                  All Issues ({issuesCount})
                </button>
              </div>

              <div class="filter-controls">
                <div class="search-container">
                  <lightning-input
                    type="search"
                    placeholder="Search issues..."
                    value={searchTerm}
                    onchange={handleSearchChange}
                    variant="label-hidden">
                  </lightning-input>
                </div>

                <lightning-combobox
                  name="typeFilter"
                  label="Filter"
                  value={selectedErrorType}
                  placeholder="All Types"
                  options={errorTypeOptions}
                  onchange={handleFilterChange}
                  variant="label-hidden">
                </lightning-combobox>
              </div>
            </div>

            <div class="slds-m-bottom_medium">
              <div class="slds-text-body_regular">
                <strong>Total Issues Found: {filteredIssues.length}</strong>
                <template if:true={searchTerm}>
                  <span class="slds-m-left_small">(Filtered)</span>
                </template>
              </div>
            </div>

            <!-- Table -->
            <div class="slds-scrollable_x">
              <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                <thead>
                  <tr class="slds-line-height_reset">
                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="Select">
                        <lightning-input type="checkbox" onchange={handleSelectAll}></lightning-input>
                      </div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="LEVEL">LEVEL</div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="ROW">ROW</div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="FIELD">FIELD</div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="TYPE">TYPE</div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="MESSAGE">MESSAGE</div>
                    </th>

                    <th class="slds-text-title_caps" scope="col">
                      <div class="slds-truncate" title="ACTIONS">ACTIONS</div>
                    </th>
                  </tr>
                </thead>

                <tbody>
                  <template for:each={paginatedIssues} for:item="issue">
                    <tr key={issue.id} class="slds-hint-parent">
                      <td data-label="Select">
                        <lightning-input
                          type="checkbox"
                          data-error-id={issue.id}
                          onchange={handleErrorSelect}
                          checked={issue.isSelected}>
                        </lightning-input>
                      </td>

                      <td data-label="LEVEL">
                        <span class={issue.levelClass}>{issue.issueLevel}</span>
                      </td>

                      <td data-label="ROW">
                        <div class="slds-truncate" title={issue.lineNumber}>
                          <template if:true={issue.lineNumber}>Row {issue.lineNumber}</template>
                          <template if:false={issue.lineNumber}>—</template>
                        </div>
                      </td>

                      <td data-label="FIELD">
                        <div class="slds-truncate" title={issue.fieldApiName}>{issue.fieldApiName}</div>
                      </td>

                      <td data-label="TYPE">
                        <span class="error-type-badge" data-error-type={issue.errorType}>
                          {issue.errorType}
                        </span>
                      </td>

                      <td data-label="MESSAGE">
                        <div class="slds-truncate" title={issue.errorMessage}>{issue.errorMessage}</div>
                      </td>

                      <td data-label="ACTIONS">
                        <div class="slds-button-group">
                          <lightning-button-icon
                            icon-name="utility:edit"
                            size="small"
                            onclick={handleEditError}
                            data-error-id={issue.id}
                            title="Edit">
                          </lightning-button-icon>
                          <lightning-button-icon
                            icon-name="utility:delete"
                            size="small"
                            onclick={handleDeleteError}
                            data-error-id={issue.id}
                            title="Delete">
                          </lightning-button-icon>
                        </div>
                      </td>
                    </tr>
                  </template>

                  <template if:true={hasNoIssuesToDisplay}>
                    <tr>
                      <td colspan="7" class="slds-text-align_center slds-p-vertical_medium">
                        <div class="slds-text-body_regular">No issues match your current filters.</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <template if:true={hasMultiplePages}>
              <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                <div class="slds-col">
                  <p class="slds-text-body_small">
                    Showing {startRecord} to {endRecord} of {filteredIssues.length} issue(s)
                  </p>
                </div>

                <div class="slds-col">
                  <div class="slds-button-group" role="group">
                    <lightning-button label="Previous" onclick={handlePreviousPage} disabled={isFirstPage} variant="neutral"></lightning-button>

                    <template for:each={pageButtons} for:item="p">
                      <lightning-button
                        key={p.number}
                        label={p.number}
                        onclick={handlePageChange}
                        data-page={p.number}
                        variant={p.variant}>
                      </lightning-button>
                    </template>

                    <lightning-button label="Next" onclick={handleNextPage} disabled={isLastPage} variant="neutral"></lightning-button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- No issues -->
        <template if:false={hasIssues}>
          <div class="slds-card slds-m-top_medium">
            <div class="slds-card__body slds-card__body_inner">
              <div class="slds-notify slds-notify_alert slds-theme_success" role="alert">
                <span class="slds-assistive-text">Success</span>
                <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                <h2>No validation issues detected! Data is ready for import.</h2>
              </div>
            </div>
          </div>
        </template>
      </template>
    </template>

    <!-- Spinner -->
    <template if:true={isLoading}>
      <div class="slds-is-relative slds-m-top_medium">
        <lightning-spinner alternative-text="Validation in progress..." size="medium"></lightning-spinner>
      </div>
    </template>

    <!-- Navigation buttons -->
    <div class="action-buttons-section">
      <div class="action-buttons-content">
        <lightning-button
          label="Back to Mapping & Transformations"
          onclick={handlePreviousStep}
          disabled={isLoading}
          variant="neutral"
          icon-name="utility:left"
          icon-position="left">
        </lightning-button>

        <div class="action-buttons-right">
          <lightning-button
            label="Skip & Continue"
            onclick={handleSkipErrors}
            disabled={isLoading}
            variant="neutral"
            class="slds-m-right_x-small">
          </lightning-button>

          <lightning-button
            label="Proceed to Execution"
            onclick={handleNextStep}
            disabled={isProceedDisabled}
            variant="brand"
            icon-name="utility:right"
            icon-position="right">
          </lightning-button>
        </div>
      </div>
    </div>
  </div>
</template>
