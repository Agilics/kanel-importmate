<template>
    <div class="results-section">
        <h2 class="results-title">{labels.title}</h2>

        <div class="results-content">

            <template if:true={isLoading}>
                <div class="spinner-container">
                    <div class="aurora-spinner"></div>
                    <p class="spinner-text">{labels.loading}</p>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasImportLogs}>

                    <!-- Filters -->
                    <div class="error-filters">
                        <div></div>
                        <div class="filter-controls">
                            <div class="search-container">
                                <input
                                    type="search"
                                    class="rounded-input"
                                    placeholder={labels.searchPlaceholder}
                                    value={searchTerm}
                                    onchange={handleSearchChange}
                                />
                            </div>
                            <select class="rounded-input" onchange={handleFilterChange}>
                                <template for:each={errorTypeOptionsWithSelected} for:item="o">
                                    <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="results-summary">
                        <strong>{labels.summaryTotal} {totalErrors}</strong>
                        <span class="summary-sep">{labels.summaryFailed} {failedRecords}</span>
                        <template if:true={searchTerm}>
                            <span class="summary-sep">({labels.summaryFiltered} {filteredLogsCount})</span>
                        </template>
                    </div>

                    <!-- Table -->
                    <div class="results-table-wrap">
                        <table class="results-table">
                            <thead>
                                <tr>
                                    <th scope="col" class="col-check">
                                        <input type="checkbox" onchange={handleSelectAll} />
                                    </th>
                                    <th scope="col">{labels.colRow}</th>
                                    <th scope="col">{labels.colField}</th>
                                    <th scope="col">{labels.colErrorType}</th>
                                    <th scope="col">{labels.colMessage}</th>
                                    <th scope="col">{labels.colCurrentValue}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template if:true={hasFilteredLogs}>
                                    <template for:each={paginatedLogs} for:item="log">
                                        <tr key={log.id}>
                                            <td data-label="Select" class="col-check">
                                                <input
                                                    type="checkbox"
                                                    data-error-id={log.id}
                                                    onchange={handleErrorSelect}
                                                    checked={log.isSelected}
                                                />
                                            </td>
                                            <td data-label="ROW">Row {log.lineNumber}</td>
                                            <td data-label="FIELD">{log.fieldApiName}</td>
                                            <td data-label="ERROR TYPE">
                                                <span class="error-type-badge" data-error-type={log.errorType}>
                                                    {log.errorType}
                                                </span>
                                            </td>
                                            <td data-label="MESSAGE">{log.errorMessage}</td>
                                            <td data-label="CURRENT VALUE">{log.currentValue}</td>
                                        </tr>
                                    </template>
                                </template>
                                <template if:false={hasFilteredLogs}>
                                    <tr>
                                        <td colspan="6" class="results-empty-row">
                                            <template if:true={searchTerm}>{labels.noMatch}</template>
                                            <template if:false={searchTerm}>{labels.noErrors}</template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <template if:true={hasMultiplePages}>
                        <div class="pagination-container">
                            <div class="pagination-info">
                                {labels.paginationShowing} {startRecord} {labels.paginationTo} {endRecord} {labels.paginationOf} {filteredLogsCount} {labels.paginationErrors}
                            </div>
                            <div class="pagination-controls">
                                <button type="button" class="pagination-btn pagination-btn--nav"
                                    onclick={handlePreviousPage} disabled={isFirstPage}>
                                    <span>‹</span> {labels.paginationPrevious}
                                </button>
                                <template for:each={pageNumbers} for:item="page">
                                    <button key={page.number} type="button"
                                        class={page.buttonClass}
                                        data-page={page.number} onclick={handlePageClick}>
                                        {page.number}
                                    </button>
                                </template>
                                <button type="button" class="pagination-btn pagination-btn--nav"
                                    onclick={handleNextPage} disabled={isLastPage}>
                                    {labels.paginationNext} <span>›</span>
                                </button>
                            </div>
                        </div>
                    </template>

                </template>

                <template if:false={hasImportLogs}>
                    <div class="no-results">
                        <p>{labels.success}</p>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
