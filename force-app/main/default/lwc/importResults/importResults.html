<template>
    <div class="results-section">
        <h2 class="results-title">{labels.title}</h2>

        <div class="results-content">

            <template if:true={isLoading}>
                <div class="spinner-container">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    <p class="spinner-text">{labels.loading}</p>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasImportLogs}>

                    <!-- Filters -->
                    <div class="error-filters">
                        <div></div>
                        <div class="filter-controls">
                            <div class="search-container">
                                <lightning-input
                                    type="search"
                                    placeholder={labels.searchPlaceholder}
                                    value={searchTerm}
                                    onchange={handleSearchChange}
                                    variant="label-hidden">
                                </lightning-input>
                            </div>
                            <lightning-combobox
                                name="errorTypeFilter"
                                label="Filter"
                                value={selectedErrorType}
                                placeholder={labels.filterAllTypes}
                                options={errorTypeOptions}
                                onchange={handleFilterChange}
                                variant="label-hidden">
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="slds-m-bottom_medium">
                        <div class="slds-text-body_regular">
                            <strong>{labels.summaryTotal} {totalErrors}</strong>
                            <span class="slds-m-left_small">{labels.summaryFailed} {failedRecords}</span>
                            <template if:true={searchTerm}>
                                <span class="slds-m-left_small">({labels.summaryFiltered} {filteredLogsCount})</span>
                            </template>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">
                                            <lightning-input type="checkbox" onchange={handleSelectAll}></lightning-input>
                                        </div>
                                    </th>
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">{labels.colRow}</div>
                                    </th>
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">{labels.colField}</div>
                                    </th>
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">{labels.colErrorType}</div>
                                    </th>
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">{labels.colMessage}</div>
                                    </th>
                                    <th class="slds-text-title_caps" scope="col">
                                        <div class="slds-truncate">{labels.colCurrentValue}</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template if:true={hasFilteredLogs}>
                                    <template for:each={paginatedLogs} for:item="log">
                                        <tr key={log.id} class="slds-hint-parent">
                                            <td data-label="Select">
                                                <lightning-input
                                                    type="checkbox"
                                                    data-error-id={log.id}
                                                    onchange={handleErrorSelect}
                                                    checked={log.isSelected}>
                                                </lightning-input>
                                            </td>
                                            <td data-label="ROW">
                                                <div class="slds-truncate" title={log.lineNumber}>
                                                    Row {log.lineNumber}
                                                </div>
                                            </td>
                                            <td data-label="FIELD">
                                                <div class="slds-truncate" title={log.fieldApiName}>
                                                    {log.fieldApiName}
                                                </div>
                                            </td>
                                            <td data-label="ERROR TYPE">
                                                <span class="error-type-badge" data-error-type={log.errorType}>
                                                    {log.errorType}
                                                </span>
                                            </td>
                                            <td data-label="MESSAGE">
                                                <div class="slds-truncate" title={log.errorMessage}>
                                                    {log.errorMessage}
                                                </div>
                                            </td>
                                            <td data-label="CURRENT VALUE">
                                                <div class="slds-truncate" title={log.currentValue}>
                                                    {log.currentValue}
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                                <template if:false={hasFilteredLogs}>
                                    <tr>
                                        <td colspan="6" class="slds-text-align_center slds-p-vertical_medium">
                                            <div class="slds-text-body_regular">
                                                <template if:true={searchTerm}>
                                                    {labels.noMatch}
                                                </template>
                                                <template if:false={searchTerm}>
                                                    {labels.noErrors}
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <template if:true={hasMultiplePages}>
                        <div class="pagination-container">
                            <div class="pagination-info">
                                {labels.paginationShowing} {startRecord} {labels.paginationTo} {endRecord} {labels.paginationOf} {filteredLogsCount} {labels.paginationErrors}
                            </div>
                            <div class="pagination-controls">
                                <lightning-button
                                    label={labels.paginationPrevious}
                                    onclick={handlePreviousPage}
                                    disabled={isFirstPage}
                                    variant="neutral"
                                    icon-name="utility:chevronleft"
                                    icon-position="left">
                                </lightning-button>
                                <template for:each={pageNumbers} for:item="page">
                                    <lightning-button
                                        key={page.number}
                                        label={page.number}
                                        onclick={handlePageClick}
                                        data-page={page.number}
                                        variant={page.variant}
                                        class="page-button">
                                    </lightning-button>
                                </template>
                                <lightning-button
                                    label={labels.paginationNext}
                                    onclick={handleNextPage}
                                    disabled={isLastPage}
                                    variant="neutral"
                                    icon-name="utility:chevronright"
                                    icon-position="right">
                                </lightning-button>
                            </div>
                        </div>
                    </template>

                </template>

                <template if:false={hasImportLogs}>
                    <div class="no-results">
                        <p>{labels.success}</p>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
