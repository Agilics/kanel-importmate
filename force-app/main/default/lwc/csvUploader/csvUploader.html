<template>
  <div class="page">
    <!-- Header -->
    <div class="page-header">
      <div>
        <div class="page-title">{title}</div>
        <div class="page-subtitle">{label.pageSubtitle}</div>
      </div>
      <button type="button" class="btn btn-icon" onclick={openSettings} title={label.importSettingsBtn}>
        ⚙
      </button>
    </div>

    <span class="badge primary-badge">{projectName}</span>

    <!-- Source Tabs — classes du prototype aurora-step2 -->
    <div class="src-tabs">
      <button type="button" class={uploadTabClass} data-tab="upload" onclick={handleTabChange}>
        📤 Upload CSV
      </button>
      <button type="button" class={storedTabClass} data-tab="stored" onclick={handleTabChange}>
        📁 Fichiers enregistrés
      </button>
    </div>

    <!-- Onglet Upload -->
    <template if:true={isUploadTab}>
      <div class="card">
        <div class="card-title">{label.cardTitle}</div>
        <div class="card-sub">{label.cardSubtitle}</div>

        <div class="drop-zone"
          ondragover={handleDragOver}
          ondragleave={handleDragLeave}
          ondrop={handleDrop}
          onclick={handleBrowseClick}>
          <div class="drop-icon">⬆</div>
          <div class="drop-title">{label.dropzoneText}</div>
          <div class="drop-sub">{label.dropzoneHint}</div>
          <div class="drop-btn">{label.dropzoneBrowse}</div>
          <input data-id="file" type="file" accept=".csv,text/csv" class="hidden-input" onchange={handleFileUpload}/>
        </div>

        <template if:true={isLoading}>
          <p class="info info--ok slds-m-top_small">{label.loading}</p>
        </template>
        <template if:true={parseError}>
          <p class="info info--error slds-m-top_small">
            <span class="custom-icon-error">✕</span>
            {parseError}
          </p>
        </template>
        <template if:true={fileName}>
          <div class="file-info">
            <span style="font-size:26px">📄</span>
            <div>
              <div class="file-info-name">{fileName}</div>
              <div class="file-info-meta">{fileSize} bytes</div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Onglet Fichiers enregistrés -->
    <template if:true={isStoredTab}>
      <div class="card">
        <div class="card-title">Fichiers CSV enregistrés</div>
        <div class="card-sub">Sélectionnez un fichier déjà uploadé pour ce projet.</div>

        <template if:true={isLoadingStoredFiles}>
          <p class="info slds-m-top_small">Chargement...</p>
        </template>

        <template if:true={hasStoredFiles}>
          <div class="stored-file-list">
            <template for:each={storedFiles} for:item="sf">
              <div key={sf.contentDocumentId}
                   class={sf.rowClass}
                   data-id={sf.contentDocumentId}
                   data-name={sf.fileName}
                   onclick={handleSelectStoredFile}>
                <span class="sf-icon">📄</span>
                <div style="flex:1;min-width:0">
                  <div class="sf-name">{sf.fileName}</div>
                  <div class="sf-meta">{sf.fileSizeLabel} · {sf.createdDate}</div>
                </div>
                <span class={sf.badgeClass}>{sf.badgeLabel}</span>
                <template if:true={sf.isSelected}>
                  <span class="stored-file-check">✓</span>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template if:false={hasStoredFiles}>
          <template if:false={isLoadingStoredFiles}>
            <div class="empty-state slds-m-top_medium">
              <div class="empty-state__icon">📄</div>
              <p class="empty-state__text">Aucun fichier CSV stocké pour ce projet. Uploadez-en un ci-dessus.</p>
            </div>
          </template>
        </template>

        <!-- Historique des exécutions passées (manuelles + planifiées) -->
        <template if:true={hasExecutionHistory}>
          <div class="card-title slds-m-top_medium">Historique des imports</div>
          <div class="stored-file-list">
            <template for:each={executionHistory} for:item="ex">
              <div key={ex.id} class="stored-file-row">
                <span class="sf-icon">{ex.statusIcon}</span>
                <div style="flex:1;min-width:0">
                  <div class="sf-name">{ex.startTime}</div>
                  <div class="sf-meta">{ex.summary}</div>
                </div>
                <span class={ex.typeClass}>{ex.typeLabel}</span>
                <span class={ex.statusClass}>{ex.status}</span>
              </div>
            </template>
          </div>
        </template>

        <template if:true={storedParseError}>
          <p class="info info--error slds-m-top_small">{storedParseError}</p>
        </template>
        <template if:true={isLoading}>
          <p class="info slds-m-top_small">{label.loading}</p>
        </template>
      </div>
    </template>

    <!-- Data Table -->
    <template if:true={hasHeaders}>
      <div class="card slds-m-top_medium">
        <div class="toolbar">
          <div class="toolbar__left">
            <div class="tbl-title">{label.tableTitle}</div>
            <span class="badge badge-green">{badgeText}</span>
          </div>
          <div class="toolbar__right">
            <div class="search">
              <span class="search__icon">🔍</span>
              <input class="search__input" type="search" placeholder={label.searchPlaceholder} oninput={handleSearchChange}/>
            </div>
            <button type="button" class="btn btn-outline btn-sm" onclick={openFilters}>
              <span>▤</span>
              <span>{label.filtersBtn}</span>
            </button>
          </div>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <template for:each={displayColumns} for:item="col">
                    <th key={col.name}>
                      <button class="th-btn" data-field={col.name} onclick={handleHeaderClick}>
                        <span>{col.name}</span>
                        <template if:true={col.isSorted}>
                          <span title="Sorted">
                            <template if:true={col.sortAsc}>▲</template>
                            <template if:false={col.sortAsc}>▼</template>
                          </span>
                        </template>
                      </button>
                    </th>
                  </template>
                  <th class="col-actions">{label.tableActions}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={pagedRows} for:item="row">
                  <tr key={row.id}>
                    <template for:each={row.values} for:item="cell">
                      <td key={cell.key}>
                        <template if:true={cell.isIndustry}>
                          <span class="tag">{cell.value}</span>
                        </template>
                        <template if:true={cell.isStatus}>
                          <span class={cell.statusClass}>{cell.value}</span>
                        </template>
                        <template if:false={cell.isIndustry}>
                          <template if:false={cell.isStatus}>{cell.value}</template>
                        </template>
                      </td>
                    </template>
                    <td class="actions-cell">
                      <button type="button" class="icon-btn" title={label.editTooltip} data-rowid={row.id} onclick={handleRowEdit}>✎</button>
                      <button type="button" class="icon-btn" title={label.previewTooltip} data-rowid={row.id} onclick={handleRowView}>👁</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="table-footer">
            <div>{showingText}</div>
            <div class="pager">
              <button type="button" class="pager__btn" onclick={gotoPrev} disabled={isFirstPage}>
                ← <span>{label.previous}</span>
              </button>
              <template for:each={pageNumbers} for:item="p">
                <span key={p.key}>
                  <template if:true={p.isEllipsis}>
                    <span class="pager__ellipsis">{p.label}</span>
                  </template>
                  <template if:false={p.isEllipsis}>
                    <template if:true={p.isActive}>
                      <button type="button" class="pager__page pager__page--active">{p.label}</button>
                    </template>
                    <template if:false={p.isActive}>
                      <button type="button" class="pager__page" data-page={p.page} onclick={gotoPage}>{p.label}</button>
                    </template>
                  </template>
                </span>
              </template>
              <button type="button" class="pager__btn" onclick={gotoNext} disabled={isLastPage}>
                <span>{label.next}</span> →
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Footer actions -->
    <div class="footer-actions">
      <button type="button" class="btn btn-outline btn-xl" onclick={handleBackClick}>
        ← <span>{label.backBtn}</span>
      </button>
      <div class="footer-actions__right">
        <button type="button" class="btn btn-primary btn-xl" onclick={handleGoForMapping} disabled={disableGoForMapping}>
          <span>{label.continueBtn}</span> →
        </button>
      </div>
    </div>

    <a data-id="download-anchor" class="visually-hidden" tabindex="-1" aria-hidden="true"></a>

    <!-- Filters Modal -->
    <template if:true={showFilters}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalFiltersTitle}</div>
          <div class="modal__body">
            <label class="lbl">{label.filtersColumn}</label>
            <select class="inp" data-id="filter-col">
              <option value="">{label.filtersColDefault}</option>
              <template for:each={columns} for:item="c">
                <option key={c} value={c}>{c}</option>
              </template>
            </select>
            <label class="lbl slds-m-top_small">{label.filtersOperator}</label>
            <select class="inp" data-id="filter-op">
              <option value="contains">{label.filtersOpContains}</option>
              <option value="equals">{label.filtersOpEquals}</option>
              <option value="starts">{label.filtersOpStarts}</option>
            </select>
            <label class="lbl slds-m-top_small">{label.filtersValue}</label>
            <input class="inp" type="text" data-id="filter-val" />
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn-ghost" onclick={clearFilters}>{label.filtersClear}</button>
            <button type="button" class="btn btn-outline" onclick={closeFilters}>{label.modalCancel}</button>
            <button type="button" class="btn btn-primary" onclick={applyFilters}>{label.modalApply}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Settings Modal -->
    <template if:true={showSettings}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalSettingsTitle}</div>
          <div class="modal__body">
            <label class="lbl">{label.settingsRows}</label>
            <input class="inp" type="number" min="1" step="1" value={pageSize} data-id="page-size" />
            <label class="lbl slds-m-top_small">{label.settingsPreview}</label>
            <input class="inp" type="number" min="1" step="1" value={previewLimit} data-id="preview-limit" />
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn-outline" onclick={closeSettings}>{label.modalCancel}</button>
            <button type="button" class="btn btn-primary" onclick={applySettings}>{label.modalApply}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Preview Modal -->
    <template if:true={showPreview}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalPreviewTitle}</div>
          <div class="modal__body">
            <template for:each={previewCells} for:item="c">
              <div key={c.label} class="slds-m-bottom_x-small">
                <strong>{c.label}:</strong> <span>{c.value}</span>
              </div>
            </template>
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn-primary" onclick={closePreview}>{label.modalClose}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Edit Modal -->
    <template if:true={showEditor}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalEditTitle}</div>
          <div class="modal__body">
            <template for:each={editBuffer} for:item="c" for:index="index">
              <div key={c.label} class="slds-m-bottom_small">
                <label class="lbl">{c.label}</label>
                <input class="inp" type="text" value={c.value} data-pos={index} oninput={editInputChanged}/>
              </div>
            </template>
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn-outline" onclick={cancelEdit}>{label.modalCancel}</button>
            <button type="button" class="btn btn-primary" onclick={saveEdit}>{label.modalSave}</button>
          </div>
        </div>
      </section>
    </template>
  </div>
</template>
