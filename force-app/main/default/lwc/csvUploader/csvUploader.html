<template>
  <div class="page">
    <div class="section">
      <div class="upload-card">
        <div class="upload-pill">
          <div class="upload-head">Import CSV</div>
          <div class="upload-sub">Click or Drop CSV file here</div>

          <!-- garde l’input pour les tests -->
          <input
            data-id="file"
            class="upload-input"
            type="file"
            accept=".csv,text/csv"
            onchange={handleFileUpload}
          />
        </div>
      </div>

      <template if:true={isLoading}>
        <p class="info info--ok slds-m-top_small">Loading…</p>
      </template>
      <template if:true={parseError}>
        <p class="info info--error slds-m-top_small">{parseError}</p>
      </template>
      <template if:true={fileName}>
        <div class="file-meta slds-m-top_small">
          <span class="file-meta__name">{fileName}</span>
          <span class="file-meta__sep">•</span>
          <span>{fileSize} bytes</span>
        </div>
      </template>

      <!-- Boutons d’action -->
      <div class="actions">
        <template if:true={showActions}>
          <button
            data-id="load-next"
            class="btn btn--ghost"
            onclick={handleLoadNext}
          >
            Load next
          </button>
          <button
            data-id="load-all"
            class="btn btn--primary"
            onclick={handleLoadAll}
          >
            Load all
          </button>
        </template>
        <button
          data-id="reset-view"
          class="btn btn--outline"
          onclick={handleResetView}
        >
          Reset view
        </button>
      </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <template for:each={columns} for:item="col">
                    <th key={col}>{col}</th>
                  </template>
                  <th class="col-actions">Actions</th>
                </tr>
              </thead>

              <tbody>
                <template for:each={pagedRows} for:item="row">
                  <tr key={row.id}>
                    <template for:each={row.values} for:item="cell">
                      <td key={cell.key}>
                        <template if:true={cell.isIndustry}>
                          <span class="tag">{cell.value}</span>
                        </template>
                        <template if:true={cell.isStatus}>
                          <span class={cell.statusClass}>{cell.value}</span>
                        </template>
                        <template if:false={cell.isIndustry}>
                          <template if:false={cell.isStatus}>
                            {cell.value}
                          </template>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="table-footer"></div>
        </div>
      </template>

      <!-- Open Field Mapper (unchanged) -->
      <template if:true={canShowGo}>
        <div class="slds-m-top_large">
          <button
            class="btn btn--primary"
            onclick={handleShowFieldMapper}
            disabled={disableGoForMapping}
          >
            Open Field Mapper
          </button>
        </div>
      </template>
      <template if:true={showFieldMapper}>
        <!-- 👇 forward the selected project to prefill the combobox -->
        <c-field-mapper
          source-columns-csv={headersCsv}
          preselected-project-id={currentProject.Id}
          preselected-target-object={currentProject.TargetObject__c}
        ></c-field-mapper>
      </template>
      <!-- Mapping table appears only after clicking "Go for mapping" -->
      <template if:true={showFieldMappingTable}>
        <div class="slds-m-top_xx-large">
          <c-field-mapping-table csv-data={csvPayload}></c-field-mapping-table>
        </div>
      </template>
    </div>
  </div>
</template>
