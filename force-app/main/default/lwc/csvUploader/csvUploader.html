<template>
  <div class="page">
    <!-- Header -->
    <div class="page-header">
      <div class="page-header__left">
        <div class="page-title">{title}</div>
        <div class="page-subtitle">{label.pageSubtitle}</div>
      </div>
      <div class="page-header__right">
        <button type="button" class="btn btn--primary" onclick={openSettings}>
          <lightning-icon icon-name="utility:setup_assistant_guide" size="x-small"></lightning-icon>
          <span style="font-size: 18px;">{label.importSettingsBtn}</span>
        </button>
      </div>
    </div>

    <span class="badge primary-badge">
      {projectName}
    </span>

    <!-- Source Tabs -->
    <div class="src-tabs-row">
      <div class="src-tabs">
        <button type="button" class={uploadTabClass} data-tab="upload" onclick={handleTabChange}>
          <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
          <span>Upload CSV</span>
        </button>
        <button type="button" class={storedTabClass} data-tab="stored" onclick={handleTabChange}>
          <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
          <span>Fichiers enregistrés</span>
        </button>
      </div>
      <button type="button" class="btn btn--ghost goto-scheduling-btn" onclick={handleGotoScheduling}
              disabled={isGotoSchedulingDisabled} title={gotoSchedulingTitle}>
        <lightning-icon icon-name="utility:date_input" size="x-small"></lightning-icon>
        <span>Planification</span>
      </button>
    </div>

    <!-- Onglet Upload -->
    <template if:true={isUploadTab}>
      <div onclick={handleBrowseClick} class="card">
        <div class="card__title">{label.cardTitle}</div>
        <div class="card__subtitle">{label.cardSubtitle}</div>

        <div class="dropzone" ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
          <div class="dropzone__icon">
            <lightning-icon icon-name="utility:upload" size="large" variant="base"></lightning-icon>
          </div>
          <div class="dropzone__text">
            {label.dropzoneText}
            <span class="browse" onclick={handleBrowseClick}> {label.dropzoneBrowse}</span>
          </div>
          <div class="dropzone__hint">{label.dropzoneHint}</div>

          <input data-id="file" type="file" accept=".csv,text/csv" class="hidden-input" onchange={handleFileUpload}/>
        </div>

        <template if:true={isLoading}>
          <p class="info info--ok slds-m-top_small">{label.loading}</p>
        </template>
        <template if:true={parseError}>
          <p class="info info--error slds-m-top_small">
             <lightning-icon icon-name="utility:error" class="custom-icon-error" size="x-small"></lightning-icon>
            {parseError}
          </p>
        </template>
        <template if:true={fileName}>
          <div class="file-meta slds-m-top_small">
            <span class="file-meta__name">{fileName}</span>
            <span class="file-meta__sep">•</span>
            <span>{fileSize} bytes</span>
          </div>
        </template>
      </div>
    </template>

    <!-- Onglet Fichiers enregistrés -->
    <template if:true={isStoredTab}>
      <div class="card">
        <div class="card__title">Fichiers CSV enregistrés</div>
        <div class="card__subtitle">Sélectionnez un fichier déjà uploadé pour ce projet.</div>

        <template if:true={isLoadingStoredFiles}>
          <p class="info slds-m-top_small">Chargement...</p>
        </template>

        <template if:true={hasStoredFiles}>
          <div class="stored-file-list">
            <template for:each={storedFiles} for:item="sf">
              <div key={sf.contentDocumentId}
                   class={sf.rowClass}
                   data-id={sf.contentDocumentId}
                   data-name={sf.fileName}
                   onclick={handleSelectStoredFile}>
                <lightning-icon icon-name="utility:file" size="x-small" class="sf-icon"></lightning-icon>
                <div style="flex:1;min-width:0">
                  <div class="sf-name">{sf.fileName}</div>
                </div>
                <span class={sf.badgeClass}>{sf.badgeLabel}</span>
                <template if:true={sf.isSelected}>
                  <lightning-icon icon-name="utility:check" size="xx-small" class="stored-file-check"></lightning-icon>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template if:false={hasStoredFiles}>
          <template if:false={isLoadingStoredFiles}>
            <div class="empty-state slds-m-top_medium">
              <lightning-icon icon-name="utility:file" size="medium" class="empty-state__icon"></lightning-icon>
              <p class="empty-state__text">Aucun fichier CSV stocké pour ce projet. Uploadez-en un ci-dessus.</p>
            </div>
          </template>
        </template>

        <!-- Historique des exécutions passées (manuelles + planifiées) -->
        <template if:true={hasExecutionHistory}>
          <div class="card__title slds-m-top_medium">Historique des imports</div>
          <div class="stored-file-list">
            <template for:each={executionHistory} for:item="ex">
              <div key={ex.id} class="stored-file-row">
                <span class="sf-icon sf-icon--status">{ex.statusIcon}</span>
                <div style="flex:1;min-width:0">
                  <div class="sf-name">{ex.startTime}</div>
                  <div class="sf-meta">{ex.summary}</div>
                </div>
                <span class={ex.typeClass}>{ex.typeLabel}</span>
                <span class={ex.statusClass}>{ex.statusLabel}</span>
                <button type="button" class="icon-btn" title="Voir les logs"
                  data-id={ex.id} data-starttime={ex.startTime} onclick={handleOpenExecutionLogs}>
                  <lightning-icon icon-name="utility:list" size="x-small"></lightning-icon>
                </button>
              </div>
            </template>
          </div>
        </template>

        <template if:true={storedParseError}>
          <p class="info info--error slds-m-top_small">{storedParseError}</p>
        </template>
        <template if:true={isLoading}>
          <p class="info slds-m-top_small">{label.loading}</p>
        </template>
      </div>
    </template>

    <!-- Data Table -->
    <template if:true={hasHeaders}>
      <div class="card slds-m-top_medium">
        <div class="toolbar">
          <div class="toolbar__left">
            <div class="title">{label.tableTitle}</div>
            <span class="badge badge--green">{badgeText}</span>
          </div>
          <div class="toolbar__right">
            <div class="search">
              <lightning-icon icon-name="utility:search" size="x-small" class="search__icon"></lightning-icon>
              <input class="search__input" type="search" placeholder={label.searchPlaceholder} oninput={handleSearchChange}/>
            </div>
            <button type="button" class="btn btn--ghost" onclick={openFilters}>
              <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
              <span>{label.filtersBtn}</span>
            </button>
          </div>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <template for:each={displayColumns} for:item="col">
                    <th key={col.name}>
                      <button class="th-btn" data-field={col.name} onclick={handleHeaderClick}>
                        <span>{col.name}</span>
                        <template if:true={col.isSorted}>
                          <span class="sort-caret" title="Sorted">
                            <template if:true={col.sortAsc}>▲</template>
                            <template if:false={col.sortAsc}>▼</template>
                          </span>
                        </template>
                      </button>
                    </th>
                  </template>
                  <th class="col-actions">{label.tableActions}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={pagedRows} for:item="row">
                  <tr key={row.id}>
                    <template for:each={row.values} for:item="cell">
                      <td key={cell.key}>
                        <template if:true={cell.isIndustry}>
                          <span class="tag">{cell.value}</span>
                        </template>
                        <template if:true={cell.isStatus}>
                          <span class={cell.statusClass}>{cell.value}</span>
                        </template>
                        <template if:false={cell.isIndustry}>
                          <template if:false={cell.isStatus}>
                            {cell.value}
                          </template>
                        </template>
                      </td>
                    </template>

                    <td class="actions-cell">
                      <button type="button" class="icon-btn" title={label.editTooltip} data-rowid={row.id} onclick={handleRowEdit}>
                        <lightning-icon icon-name="utility:edit" size="x-small"></lightning-icon>
                      </button>
                      <button type="button" class="icon-btn" title={label.previewTooltip} data-rowid={row.id} onclick={handleRowView}>
                        <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="table-footer">
            <div class="table-footer__left">
              {showingText}
            </div>
            <div class="table-footer__right pager">
              <button type="button" class="pager__btn" onclick={gotoPrev} disabled={isFirstPage}>
                <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                <span class="slds-m-left_xx-small">{label.previous}</span>
              </button>

              <template for:each={pageNumbers} for:item="p">
                <span key={p.key}>
                  <template if:true={p.isEllipsis}>
                    <span class="pager__ellipsis">{p.label}</span>
                  </template>
                  <template if:false={p.isEllipsis}>
                    <template if:true={p.isActive}>
                      <button type="button" class="pager__page pager__page--active">{p.label}</button>
                    </template>
                    <template if:false={p.isActive}>
                      <button type="button" class="pager__page" data-page={p.page} onclick={gotoPage}>{p.label}</button>
                    </template>
                  </template>
                </span>
              </template>

              <button type="button" class="pager__btn" onclick={gotoNext} disabled={isLastPage}>
                <span class="slds-m-right_xx-small">{label.next}</span>
                <lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Footer actions -->
    <div class="footer-actions">
      <button type="button" class="btn btn--ghost btn--xl" onclick={handleBackClick}>
        <lightning-icon icon-name="utility:back" size="x-small"></lightning-icon>
        <span>{label.backBtn}</span>
      </button>
      <div class="footer-actions__right">
        <button type="button"
          class="btn btn--primary"
          onclick={handleGoForMapping}
          disabled={disableGoForMapping}>
          <span>{label.continueBtn}</span>
          <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
        </button>
      </div>
    </div>

    <!-- Hidden anchor (Locker-safe downloads) -->
    <a data-id="download-anchor" class="visually-hidden" tabindex="-1" aria-hidden="true"></a>

    <!-- Filters Modal -->
    <template if:true={showFilters}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalFiltersTitle}</div>
          <div class="modal__body">
            <label class="lbl">{label.filtersColumn}</label>
            <select class="inp" data-id="filter-col">
              <option value="">{label.filtersColDefault}</option>
              <template for:each={columns} for:item="c">
                <option key={c} value={c}>{c}</option>
              </template>
            </select>

            <label class="lbl slds-m-top_small">{label.filtersOperator}</label>
            <select class="inp" data-id="filter-op">
              <option value="contains">{label.filtersOpContains}</option>
              <option value="equals">{label.filtersOpEquals}</option>
              <option value="starts">{label.filtersOpStarts}</option>
            </select>

            <label class="lbl slds-m-top_small">{label.filtersValue}</label>
            <input class="inp" type="text" data-id="filter-val" />
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--ghost" onclick={clearFilters}>{label.filtersClear}</button>
            <div class="modal__spacer"></div>
            <button type="button" class="btn btn--ghost" onclick={closeFilters}>{label.modalCancel}</button>
            <button type="button" class="btn btn--primary" onclick={applyFilters}>{label.modalApply}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Settings Modal -->
    <template if:true={showSettings}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalSettingsTitle}</div>
          <div class="modal__body">
            <label class="lbl">{label.settingsRows}</label>
            <input class="inp" type="number" min="1" step="1" value={pageSize} data-id="page-size" />
            <label class="lbl slds-m-top_small">{label.settingsPreview}</label>
            <input class="inp" type="number" min="1" step="1" value={previewLimit} data-id="preview-limit" />
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--ghost" onclick={closeSettings}>{label.modalCancel}</button>
            <button type="button" class="btn btn--primary" onclick={applySettings}>{label.modalApply}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Preview Modal -->
    <template if:true={showPreview}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalPreviewTitle}</div>
          <div class="modal__body">
            <template for:each={previewCells} for:item="c">
              <div key={c.label} class="slds-m-bottom_x-small">
                <strong>{c.label}:</strong> <span>{c.value}</span>
              </div>
            </template>
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--primary" onclick={closePreview}>{label.modalClose}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Edit Modal -->
    <template if:true={showEditor}>
      <section class="modal-backdrop">
        <div class="modal">
          <div class="modal__header">{label.modalEditTitle}</div>
          <div class="modal__body">
            <template for:each={editBuffer} for:item="c" for:index="index">
              <div key={c.label} class="slds-m-bottom_small">
                <label class="lbl">{c.label}</label>
                <input class="inp" type="text" value={c.value} data-pos={index} oninput={editInputChanged}/>
              </div>
            </template>
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--ghost" onclick={cancelEdit}>{label.modalCancel}</button>
            <button type="button" class="btn btn--primary" onclick={saveEdit}>{label.modalSave}</button>
          </div>
        </div>
      </section>
    </template>

    <!-- Modale "Logs d'exécution" (historique des imports) -->
    <template if:true={showExecutionLogsModal}>
      <c-schedule-execution-logs-modal
        execution-id={logsModalExecutionId}
        schedule-name={logsModalScheduleName}
        onclosemodal={handleCloseExecutionLogsModal}
      ></c-schedule-execution-logs-modal>
    </template>
  </div>
</template>
