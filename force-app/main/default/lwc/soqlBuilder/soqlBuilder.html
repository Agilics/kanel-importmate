<template>
  <div class="page">
    <!-- LEFT COLUMN -->
    <aside class="left">
      <h2 class="panel-title">{labels.IM_Soql_Title}</h2>

      <!-- Selected Object (read-only, from projectTargetObject) -->
      <div class="card">
        <div class="section-title">{labels.IM_Soql_SelectedObject}</div>
        <lightning-input
          type="text"
          value={selectedObject}
          disabled
          class="selected-object-input"
        ></lightning-input>
      </div>

      <!-- Select Fields -->
      <div class="card">
        <div class="section-title row">
          <span>{labels.IM_Soql_SelectFields}</span>
          <span class="muted actions-inline">
            <a onclick={selectAll}>{labels.IM_Soql_SelectAll}</a>
            <span class="sep">|</span>
            <a onclick={clearAll}>{labels.IM_Soql_Clear}</a>
          </span>
        </div>

        <div class="fields-list">
          <template for:each={fieldsMeta} for:item="f">
            <label class="field-item" key={f.apiName}>
              <lightning-input
                type="checkbox"
                checked={f.checked}
                data-api={f.apiName}
                onchange={toggleField}
              ></lightning-input>
              <span class="fname">{f.label}</span>
              <span class="ftype">{f.type}</span>
            </label>
          </template>
        </div>
      </div>

      <!-- Query Settings -->
      <div class="card">
        <div class="section-title">{labels.IM_Soql_QuerySettings}</div>

        <lightning-input
          type="number"
          label={labels.IM_Soql_RecordLimit}
          value={limitRows}
          onchange={handleLimitChange}
        ></lightning-input>

        <lightning-combobox
          label={labels.IM_Soql_OrderBy}
          value={orderByField}
          options={orderByFieldOptions}
          onchange={handleOrderByChange}
        ></lightning-combobox>

        <lightning-combobox
          label={labels.IM_Soql_Direction}
          value={orderDirection}
          options={directionOptions}
          onchange={handleDirectionChange}
        ></lightning-combobox>

        <div class="btns-vertical">
          <button class="btn-validate" onclick={handleValidate} disabled={isLoading}>
            <lightning-icon icon-name="utility:check" size="x-small" class="btn-icon"></lightning-icon>
            {labels.IM_Soql_ValidateQuery}
          </button>

          <button class="btn-preview" onclick={handlePreview} disabled={isLoading}>
            <lightning-icon icon-name="utility:preview" size="x-small" class="btn-icon"></lightning-icon>
            {labels.IM_Soql_PreviewResults}
          </button>
        </div>
      </div>
    </aside>

    <!-- CENTER COLUMN -->
    <main class="center">
      <!-- Condition Builder -->
      <div class="card card-fixed">
        <div class="title-row">
          <h3 class="section-title big">{labels.IM_Soql_ConditionBuilder}</h3>
          <button class="btn-add-condition" onclick={addCondition}>
            <lightning-icon icon-name="utility:add" size="x-small" class="btn-icon-right"></lightning-icon>
            {labels.IM_Soql_AddCondition}
          </button>
        </div>

        <div class="h-scroll">
          <div class="h-row">
            <template for:each={conditions} for:item="c" for:index="i">
              <div key={c.id} class="cond-row">
                <lightning-combobox
                  class="cond-field"
                  data-idx={i}
                  value={c.field}
                  placeholder="Field"
                  options={fieldOptions}
                  onchange={updateCondField}
                ></lightning-combobox>

                <lightning-combobox
                  class="cond-op"
                  data-idx={i}
                  value={c.operator}
                  options={operatorOptions}
                  onchange={updateCondOp}
                ></lightning-combobox>

                <lightning-input
                  class="cond-val"
                  data-idx={i}
                  type="text"
                  value={c.value}
                  placeholder="Enter value…"
                  onchange={updateCondVal}
                ></lightning-input>

                <lightning-combobox
                  class="cond-joiner"
                  data-idx={i}
                  value={c.joiner}
                  options={joinerOptions}
                  onchange={updateCondJoiner}
                ></lightning-combobox>

                <lightning-button-icon
                  class="cond-trash"
                  icon-name="utility:delete"
                  alternative-text="Remove"
                  data-idx={i}
                  onclick={removeCondition}
                ></lightning-button-icon>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Generated SOQL Query -->
      <div class="card card-fixed">
        <div class="title-row">
          <h3 class="section-title big">{labels.IM_Soql_GeneratedQuery}</h3>
          <div class="title-actions">
            <lightning-button-icon
              icon-name="utility:copy"
              alternative-text={labels.IM_Soql_CopyQuery}
              class="copy-icon"
              onclick={copySoql}
            ></lightning-button-icon>
          </div>
        </div>

        <div class="soql-block">
          <pre class="soql-code">
            <template for:each={soqlTokens} for:item="t">
              <span key={t.key} class={t.cls}>{t.text}</span>
            </template>
          </pre>
        </div>
      </div>

      <!-- Query Results Preview -->
      <div class="card card-fixed">
        <div class="title-row">
          <h3 class="section-title big">{labels.IM_Soql_QueryResultsPreview}</h3>
          <div class="meta">
            <template if:true={hasRows}>
              <span class="found">
                {foundRecordsLabel}
              </span>
              <a class="export" onclick={exportCsv}>{labels.IM_Soql_Export}</a>
            </template>
          </div>
        </div>

        <div class="h-scroll">
          <table class="preview-table">
            <thead>
              <tr>
                <template for:each={columns} for:item="c">
                  <th key={c.key}>{c.label}</th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={displayRows} for:item="r">
                <tr key={r.id}>
                  <template for:each={r.cells} for:item="cell">
                    <td key={cell.key}>
                      <template if:true={cell.isBadge}>
                        <span class="pill pill-default">{cell.value}</span>
                      </template>
                      <template if:false={cell.isBadge}>
                        {cell.value}
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="results-footer">
          <div class="results-count">
            <span class="muted">{foundCountText}</span>
          </div>

          <button class="btn-continue" onclick={handleContinue} disabled={isContinueDisabled}>
            <lightning-icon icon-name="utility:forward" size="x-small" class="btn-icon"></lightning-icon>
            {labels.IM_Soql_ContinueToMapping}
          </button>
        </div>
      </div>
    </main>
  </div>

  <template if:true={isLoading}>
    <div class="spinner-overlay">
      <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </div>
  </template>

  <c-backbutton onback={handleBackToMain}></c-backbutton>
</template>
