<template>
  <div class="container">
    <!-- Selected project banner -->
    <template if:true={currentProject}>
      <h1 class="slds-text-align_center">
        Selected project: {projectName}
      </h1>
      <br />
    </template>

    <!-- Source selection -->
    <template if:true={showSelection}>
      <h2 class="section-title">Data source</h2>
      <div class="cards">
        <div class="card" onclick={handleCSV}>
          <div class="card-icon file-icon"></div>
          <h3>Import CSV</h3>
          <p>Import a CSV file from your local machine.</p>
        </div>

        <div class="card" onclick={handleSOQL}>
          <div class="card-icon soql-icon"></div>
          <h3>SOQL Builder</h3>
          <p>Build your query interactively from Salesforce objects.</p>
        </div>
      </div>
    </template>

    <!-- CSV -->
    <template if:true={showCSV}>
      <c-csv-uploader
          current-project={currentProject}
          oncsvloaded={handleCsvLoaded}
          ongotomapping={handleGoToMappingFromCsv}
      >
      </c-csv-uploader>
    </template>

    <!-- SOQL -->
    <template if:true={showSOQL}>
    <c-soql-builder
        project-target-object={projectTargetObject}
        onsoqlbuilt={handleSoqlBuilt}
        onstartmapping={handleStartMappingFromSoql}
    ></c-soql-builder>

    </template>
  </div>
</template>
