<template>
    <header class="app-header">
        <div class="header-container">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-icon">
                    <lightning-icon icon-name="utility:download" size="small" alternative-text="ImportMate"></lightning-icon>
                </div>
                <h1 class="app-title">ImportMate</h1>
            </div>

            <!-- Navigation Tabs -->
            <nav class="nav-tabs">
                <button class={dashboardClass} onclick={handleNavigation} data-page="dashboard">
                    Dashboard
                </button>
                <button class={newProjectClass} onclick={handleNavigation} data-page="projects">
                    Nouveau projet
                </button>
                <button class={historyClass} onclick={handleNavigation} data-page="history">
                    Historique
                </button>
            </nav>

            <!-- Actions -->
            <div class="header-actions">
                <button class="avatar-btn" title={userFullName}>{userInitials}</button>
            </div>
        </div>
