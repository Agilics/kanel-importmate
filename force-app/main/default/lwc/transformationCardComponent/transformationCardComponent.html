<template>
  <div class={cardClass}>
    <!-- card headers -->
    <div class="card-header">
      <!-- title with icon-->
      <div class="title-with-icon">
        <div class={iconBoxClass}>
          <lightning-icon icon-name={iconName} class={headIconClass} size="small"></lightning-icon>
        </div>
        <div class="header-content">
          <div class="header-title">{cardHeadTitle}</div>
          <p class="regular-text regular-text-size">{cardHeadSubtitle}</p>
        </div>
      </div>

      <!-- actions buttons -->
       <template if:true={showActionButtons}>

      <div class="actions">
      
        <!-- icon buttons for editing & removing -->
        <lightning-icon class="btn-action-icons" icon-name="utility:edit" alternative-text="edit" size="xx-small" title="edit"
         onclick={handleEditTransformation} style="cursor: pointer"></lightning-icon>
      
        <lightning-icon class="btn-action-icons custom-icon-delete" icon-name="utility:delete" style="cursor: pointer"
          alternative-text="delete" onclick={handleDeleteTransformation} title="delete" size="xx-small"></lightning-icon>
      </div>  
      </template>
    
    </div>

    <!-- card body -->
    <div class="card-content"> 
        <div class="transformation-rules">
          <div class="infos">       
                <div class="info-content">
                  <p class="regular-text regular-text-size">Field : {targetField}</p>
                  <template if:true={showRuleType}>
                    <p class="regular-text regular-text-size">Type : {ruleType}</p>
                  </template>
                  <template if:true={showOrder}>
                    <p class="regular-text regular-text-size">
                      Order: {order}
                    </p>
                  </template>
                  <template if:true={status}>
                      <div class={badgeClass}>{status}</div>
                  </template>
                </div> 
          </div>
        </div> 

      <!-- data first -->
      <template if:true={showComparison}>
          <div class="transformation-rules">
            <h3 class="content-title regular-text-size">Example:</h3>
            <div class="lead-content">
              <p class="regular-text regular-text-size">{dataComparison}</p>
            </div>
          </div>
      </template>
       
    </div>
  </div>
</template>
