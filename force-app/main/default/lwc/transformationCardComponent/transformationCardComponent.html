<template>
  <div class={cardClass}>
    <!-- card headers -->
    <div class="card-header">
      <!-- title with icon-->
      <div class="title-with-icon">
        <div class={iconBoxClass}>
          <lightning-icon
            icon-name={iconName}
            class={headIconClass}
            size="small"
          ></lightning-icon>
        </div>
        <div class="header-content">
          <div class="header-title">{cardHeadTitle}</div>
          <p class="regular-text regular-text-size">{cardHeadSubtitle}</p>
        </div>
      </div>

      <!-- actions buttons -->
      <div class="actions">
        <!-- badge status -->
        <div class={badgeClass}>{badgeText}</div>
        <!-- end badge status -->
        <!-- icon buttons for editing & removing -->
        <lightning-icon
          class="btn-action-icons"
          icon-name="utility:edit"
          alternative-text="edit"
          size="xx-small"
          title="edit"
          onclick={handleEditTransformation}
          style="cursor: pointer;:hover{background-color: #1e40af; }"
        ></lightning-icon>

        <lightning-icon
          class="btn-action-icons"
          icon-name="utility:delete"
          style="cursor: pointer;:hover{background-color: #1e40af; }"
          alternative-text="delete"
          onclick={handleDeleteTransformation}
          title="delete"
          size="xx-small"
        ></lightning-icon>
      </div>
    </div>

    <!-- card body -->
    <div class="card-content">
      <!-- if it's not a lead card-->
      <template if:false={isLeadStatus}>
        <div class="transformation-rules">
          <h3 class="content-title regular-text-size">Transformation Rules</h3>
          <div class="infos">
            <template for:each={transformationsRulesContent} for:item="item">
              <div key={item.Id} class="check-list">
                <div class="dot is-centered" arial-label="check circle icon">
                  <lightning-icon
                    icon-name="utility:check"
                    alternative-text="check"
                    class="custom-icon-check"
                    title="check"
                    size="xx-small"
                  ></lightning-icon>
                </div>
                <p class="regular-text regular-text-size">{item.label}</p>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- if it's a lead card value mappings-->
      <template if:true={isLeadStatus}>
        <div class="transformation-rules">
          <h3 class="content-title regular-text-size">Value Mappings</h3>
          <template for:each={mappings} for:item='item'>
            <div class="lead-content" key={item.Id}>
              <p class="regular-text regular-text-size">{item.label}</p>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</template>
