<template>
  <div class="ih-shell">

    <!-- ══ PAGE HEADER ══ -->
    <div class="ih-header-row">
      <div>
        <h1 class="ih-title">{label.title}</h1>
        <p class="ih-subtitle">{label.subtitle}</p>
      </div>
      <button type="button" class="ih-primary-btn" onclick={handleNewImportProject}>＋ {label.newImportProject}</button>
    </div>

    <!-- ══ KPI STRIP ══ -->
    <section class="ih-kpi-row">
      <article class="ih-kpi-card">
        <div class="ih-kmi-icon ih-kmi-icon-indigo">📦</div>
        <div>
          <div class="ih-kmi-val">{totalExecutions}</div>
          <div class="ih-kmi-label">{label.kpiTotalExecutions}</div>
        </div>
      </article>

      <article class="ih-kpi-card">
        <div class="ih-kmi-icon ih-kmi-icon-green">✅</div>
        <div>
          <div class="ih-kmi-val ih-kmi-val-green">{successRateDisplay}</div>
          <div class="ih-kmi-label">{label.kpiSuccessRate}</div>
        </div>
      </article>

      <article class="ih-kpi-card">
        <div class="ih-kmi-icon ih-kmi-icon-coral">❌</div>
        <div>
          <div class="ih-kmi-val">{recordsProcessedDisplay}</div>
          <div class="ih-kmi-label">{label.kpiRecordsProcessed}</div>
        </div>
      </article>

      <article class="ih-kpi-card">
        <div class="ih-kmi-icon ih-kmi-icon-amber">📊</div>
        <div>
          <div class="ih-kmi-val">{avgDurationDisplay}</div>
          <div class="ih-kmi-label">{label.kpiAvgDuration}</div>
        </div>
      </article>
    </section>

    <!-- ══ FILTER BAR ══ -->
    <div class="ih-filter-bar">
      <div class="ih-search-box">
        <span class="ih-search-icon">🔍</span>
        <input type="search" class="ih-search-input" placeholder={label.tableSearch}
          value={searchTerm} oninput={handleSearchChange} />
      </div>

      <select class="ih-filter-select" onchange={handleStatusChange}>
        <template for:each={statusOptionsWithSelected} for:item="o">
          <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
        </template>
      </select>

      <select class="ih-filter-select" onchange={handleProjectChange}>
        <template for:each={projectOptionsWithSelected} for:item="o">
          <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
        </template>
      </select>

      <select class="ih-filter-select" onchange={handleDateRangeChange}>
        <template for:each={dateRangeOptionsWithSelected} for:item="o">
          <option key={o.value} value={o.value} selected={o.isSelected}>{o.label}</option>
        </template>
      </select>

      <button type="button" class="ih-apply-btn" onclick={handleApplyFilters}>{label.applyFilters}</button>
      <button type="button" class="ih-export-btn" onclick={handleExport}>📤 {label.exportReport}</button>
    </div>

    <!-- ══ HISTORY TABLE ══ -->
    <div class="ih-table-card">
      <div class="ih-table-header-row">
        <h2 class="ih-table-title">{label.tableTitle}</h2>
        <div class="ih-table-header-right">
          <button type="button" class="ih-del-sel-btn" onclick={handleDeleteSelected} disabled={isBulkDeleteDisabled}>
            🗑 {deleteSelectedLabel}
          </button>
        </div>
      </div>

      <div class="ih-table-wrapper">
        <template if:true={isDeleting}>
          <div class="ih-spinner-overlay">
            <div class="ih-spinner"></div>
          </div>
        </template>

        <table class="ih-table">
          <thead>
            <tr>
              <th>
                <input type="checkbox" checked={isAllPageSelected} onchange={handleToggleSelectPage} />
              </th>
              <th>{label.tableColProject}</th>
              <th>{label.tableColStarted}</th>
              <th>{label.tableColDuration}</th>
              <th>{label.tableColRecords}</th>
              <th>{label.tableColStatus}</th>
              <th class="ih-actions-col">{label.tableColActions}</th>
            </tr>
          </thead>

          <tbody>
            <template if:true={pageRows}>
              <template if:true={pageRows.length}>
                <template for:each={pageRows} for:item="row">
                  <tr key={row.id} data-id={row.id} onclick={handleRowClick}>

                    <td onclick={handleCellClick}>
                      <input type="checkbox" data-id={row.id}
                        checked={row.isSelected} onchange={handleToggleSelectRow} />
                    </td>

                    <!-- Projet -->
                    <td>
                      <div class="ih-project-cell">
                        <div class={row.iconBgClass}>{row.iconEmoji}</div>
                        <div class="ih-project-text">
                          <div class="ih-project-name">{row.projectName}</div>
                          <span class="ih-proj-obj">{row.targetObject}</span>
                        </div>
                      </div>
                    </td>

                    <!-- Démarré le -->
                    <td>
                      <div class="ih-exec-date">{row.startedText}</div>
                      <div class="ih-exec-time">{row.executionLabel}</div>
                    </td>

                    <!-- Durée -->
                    <td>
                      <span class="ih-exec-dur">{row.durationText}</span>
                    </td>

                    <!-- Enregistrements -->
                    <td>
                      <div class="ih-rec-counts">
                        <span class="ih-rec-ok">{row.recordsText}</span>
                        <span class="ih-rec-err">{row.phaseText}</span>
                      </div>
                    </td>

                    <!-- Statut -->
                    <td>
                      <span class={row.statusClass}>{row.statusLabel}</span>
                      <template if:true={row.showStatusDot}>
                        <span class={row.statusDotClass}></span>
                      </template>
                    </td>

                    <!-- Actions -->
                    <td class="ih-actions-cell" onclick={handleCellClick}>
                      <div class="ih-actions-inline">
                        <button
                          class="ih-row-btn ih-row-btn-view"
                          data-id={row.id}
                          onclick={handleView}
                        >Détails</button>
                        <button
                          class="ih-row-btn ih-row-btn-export"
                          data-id={row.id}
                          onclick={handleExportSelected}
                        >📤</button>
                        <button
                          class="ih-row-btn ih-row-btn-del"
                          data-id={row.id}
                          onclick={handleDeleteExecution}
                          disabled={isBusy}
                        >🗑</button>
                      </div>
                    </td>

                  </tr>
                </template>
              </template>

              <template if:false={pageRows.length}>
                <tr>
                  <td colspan="7" class="ih-empty">{label.tableEmpty}</td>
                </tr>
              </template>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="ih-pager">
        <span class="ih-pager-info">{showingText}</span>
        <div class="ih-pager-btns">
          <button
            class="ih-pg"
            onclick={handlePrevious}
            disabled={isPreviousDisabled}
          >←</button>
          <span class="ih-pg ih-pg-active">{currentPage}</span>
          <button
            class="ih-pg"
            onclick={handleNext}
            disabled={isNextDisabled}
          >→</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ══ DRAWER OVERLAY ══ -->
  <template if:true={showViewModal}>
    <div class="ih-drawer-overlay" onclick={closeViewModal}></div>
    <div class="ih-drawer ih-drawer-open">
      <div class="ih-drawer-header">
        <div class="ih-drawer-title">Détails — {selectedRow.executionLabel}</div>
        <button class="ih-drawer-close" onclick={closeViewModal}>✕</button>
      </div>

      <div class="ih-drawer-body">

        <!-- Résumé -->
        <div class="ih-drawer-section">
          <div class="ih-drawer-sec-title">Résumé</div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailStatus}</span>
            <span class="ih-dr-val"><span class={selectedRow.statusClass}>{selectedRow.statusLabel}</span></span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailTargetObject}</span>
            <span class="ih-dr-val">{selectedRow.targetObject}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailPhase}</span>
            <span class="ih-dr-val">{selectedRow.phaseText}</span>
          </div>
        </div>

        <!-- Métriques -->
        <div class="ih-drawer-section">
          <div class="ih-drawer-sec-title">{label.modalRecords}</div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailProcessed}</span>
            <span class="ih-dr-val ih-dr-val-green">{selectedRow.processed}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailSuccess}</span>
            <span class="ih-dr-val ih-dr-val-green">{selectedRow.success}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailFailed}</span>
            <span class="ih-dr-val ih-dr-val-coral">{selectedRow.failed}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailTotal}</span>
            <span class="ih-dr-val">{selectedRow.total}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailRemaining}</span>
            <span class="ih-dr-val">{selectedRow.remaining}</span>
          </div>
        </div>

        <!-- Timing -->
        <div class="ih-drawer-section">
          <div class="ih-drawer-sec-title">{label.modalExecDetails}</div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailStarted}</span>
            <span class="ih-dr-val">{selectedRow.startedText}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailDuration}</span>
            <span class="ih-dr-val">{selectedRow.durationText}</span>
          </div>
          <div class="ih-drawer-row">
            <span class="ih-dr-key">{label.detailRecordsSummary}</span>
            <span class="ih-dr-val">{selectedRow.recordsText}</span>
          </div>
        </div>

      </div>

      <div class="ih-drawer-footer">
        <button type="button" class="ih-export-btn" onclick={handleExportSelected}>📤 {label.modalExportExec}</button>
        <button type="button" class="ih-del-btn" data-id={selectedRow.id}
          onclick={handleDeleteExecution} disabled={isDeleteSelectedDisabled}>🗑 {label.modalDeleteExec}</button>
      </div>
    </div>
  </template>

  <!-- ══ CREATE PROJECT MODAL ══ -->
  <template if:true={showCreateModal}>
    <section class="ih-modal-backdrop">
      <div class="ih-modal">
        <div class="ih-modal-header">
          <h2>{label.modalCreateTitle}</h2>
          <button type="button" class="ih-modal-close" onclick={handleCreateCancel}>✕</button>
        </div>
        <div class="ih-modal-body">
          <c-project-form-card-component
            onsaveproject={handleProjectSaved}
            oncancel={handleCreateCancel}
          ></c-project-form-card-component>
        </div>
      </div>
    </section>
  </template>

</template>
