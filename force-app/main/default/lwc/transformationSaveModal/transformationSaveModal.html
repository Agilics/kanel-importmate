<template>
   <lightning-modal-header label={modalLabel}></lightning-modal-header>
   <lightning-modal-body>
      <div class="slds-form slds-form_stacked">

         <div class="section-header">
             <lightning-icon 
               icon-name='utility:data_mapping' 
               alternative-text='calculated_insights' class="primary-icon" size='medium'
               title='calculated_insights'>
            </lightning-icon>
            <h2>Mapping</h2>
         </div>
         

         <!-- Sélection du mapping -->
         <div class="form-row">
            <div class="form-control">
            <label class="slds-form-element__label" for="sourceColumn">
               Source Column<abbr class="slds-required" title="required">*</abbr>
               </label>
            <lightning-input  id="sourceColumn" type="text" value={source} disabled></lightning-input>
            </div>
            <div class="form-control">
                <label class="slds-form-element__label" for="targetField">
                  Target Field<abbr class="slds-required" title="required">*</abbr>
                  </label>
               <lightning-input  id="targetField" type="text" value={target} disabled></lightning-input>
               </div>
            </div>

         <!-- rule section-->
          <div class="section-header">
             <lightning-icon
               icon-name='utility:formula'
               alternative-text='utility:formula' class="primary-icon" size='medium'
               title='utility:formula'>
            </lightning-icon>
            <h2>Rules</h2>
         </div>
         <div class="slds-form-element">
            <label class="slds-form-element__label" for="ruleType">
            Rule Type <abbr class="slds-required" title="required">*</abbr>
            </label>
            <div class="slds-form-element__control">
               <lightning-combobox id="ruleType" name="ruleType" value={ruleType} options={ruleTypeOptions}
                  onchange={handleRuleTypeChange} class="rounded-input">
               </lightning-combobox>
            </div>
         </div>
         <!-- Champs pour la concaténation -->
         <template if:true={showConcatenationFields}>
            <div class="slds-form-element slds-m-bottom_medium">
               <label class="slds-form-element__label" for="sourceFields">
               Source Fields <abbr class="slds-required" title="required">*</abbr>
               </label>
               <div class="slds-form-element__control">
                  <lightning-dual-listbox id="sourceFields" name="sourceFields" label="Champs sources"
                     source-label="Source Fields" selected-label="Target Fields"
                     options={targetFieldOptions} value={preSelectedColumns}  onchange={handleTargetFieldsChange}
                     max="3" class="rounded-input">
                  </lightning-dual-listbox>
               </div>
               <div class="slds-form-element__help">
                  Select 1 to a maximum of 3 fields. {selectedFieldsCount} on 3 selected
               </div>
            </div>
            <div class="slds-form-element slds-m-bottom_medium">
               <label class="slds-form-element__label" for="separator">
               Separator
               </label>
               <div class="slds-form-element__control">
                  <lightning-combobox id="separator" name="separator" class="rounded-input"  value={separator} options={separatorOptions}
                     onchange={handleSeparatorChange}>
                  </lightning-combobox>
               </div>
            </div>
         </template>

         
         <!-- boolean transformation -->
          <template if:true={isBooleanTransformation}>
            <div class="slds-form-element slds-m-bottom_medium">
               <div class="slds-form-element__control">
                      <label class="slds-form-element__label" for="sourceFields">
                        Choose the boolean value <abbr class="slds-required" title="required">*</abbr>
                     </label>
                  <lightning-input  
                     class="rounded-input"
                     onchange={handleBooleanValueChange}
                     type="toggle"  
                     label='Boolean Value'
                     message-toggle-active= 'Yes'
                     message-toggle-inactive = 'No'
                     checked={booleanValue}>
                  </lightning-input> 
               </div>
            </div>
         
          </template>

         
      </div>
   </lightning-modal-body>
   <lightning-modal-footer>
      <div class="btns">
         <button aria-label="Cancel transformation rule creation" onclick={handleCancel}
            class="btn btn-secondary">
            <label>Cancel</label>
         </button>
         
         <template if:true={isEdit}>
            <button class="btn btn-primary" onclick={handleUpdateRule}>
               <label>Update rule</label>
            </button>
         </template>
         <template if:false={isEdit}>
            <button class="btn btn-primary" onclick={handleSaveTransformation}>
               <label>Save rule</label>
            </button>
         </template>
      </div>
   </lightning-modal-footer>
</template>
