<template>
   <template if:true={showSelection}>
      <div class="container">
                 <!-- header title -->
          <div class="header">
            <h1 class="header-title">Choose Data Source</h1>
            <p class="header-subtitle">
                Select how you want to import your data into Salesforce
            </p>
          </div>
         <div class="cards">
            <!-- CARD FILE UPLOAD -->
            <div class="upload">
               <c-data-source-selector-card
                  contents={uploadContents}
                  title={uploadTitle}
                  subtitle={uploadSubtitle}
                  is-upload={isUpload}
                  current-project={currentProject}
                  oncardaction={handleCSV}>
               </c-data-source-selector-card>
            </div>
            <!-- END CARD FILE UPLOAD -->

            <!-- CARD QUERY BUILDER -->
            <div class="query">
               <c-data-source-selector-card
                  contents={queryContents}
                  title={queryTitle}
                  subtitle={querySubTitle}
                  is-upload={isNotUpload}
                  current-project={currentProject}
                  oncardaction={handleSOQL}>
               </c-data-source-selector-card>
            </div>
            <!-- END CARD QUERY UPLOAD -->

         </div>
      </div>
   </template>

   <!-- CSV -->
   <template if:true={showCSV}>
      <!-- pass the selected project object down -->
      <c-csv-uploader
         current-project={currentProject}
         oncsvloaded={handleCsvLoaded}
         ongotomapping={handleGoToMappingFromCsv}>
      </c-csv-uploader>
   </template>

   <!-- SOQL -->
   <template if:true={showSOQL}>
      <c-soql-builder onsoqlbuilt={handleSoqlBuilt}></c-soql-builder>
   </template>
</template>
