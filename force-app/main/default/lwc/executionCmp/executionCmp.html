<template>
  <div class="execution-container">
    <div class="page-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="header-title">{labels.title}</h1>
          <p class="header-subtitle">{labels.subtitle}</p>
        </div>

        <div class="header-actions">
          <button 
            onclick={handleExportLogsCsv}
            disabled={isExportLogsDisabled} 
             class="btn btn-secondary export-button"
          >
          <lightning-icon icon-name="utility:download" class="icon secondary-icon"
            size='small' title='download'>
          </lightning-icon>
          <label>{labels.btnExportLogs}</label>
          </button>

          <button  
            onclick={handleScheduleImport}
            disabled={isScheduleImportDisabled} 
            class="btn btn-secondary schedule-button">
            <lightning-icon icon-name="utility:event" class="icon secondary-icon"
            alternative-text='lightning_component' size='small' title='import schedule'>
            </lightning-icon>
            <label>{labels.btnSchedule}</label>
          </button>

          <button 
            onclick={handleStartImport}
            disabled={isStartImportDisabled} 
            class="btn btn-primary start-button"
          >
           <lightning-icon icon-name="utility:play" class="icon primary-icon"
            alternative-text='lightning_component' size='x-small' title='start import'>
            </lightning-icon>
          <label>{labels.btnStart}</label>
        </button>
        </div>
      </div>
      <span class="badge primary-badge">{projectName}</span>
    </div>
    <div>
    </div>
    <!-- Page cards Scheduled | Immediate Execution -->
    <div class="execution-grid "> 
      <!-- Immediate Execution Card -->
      <div class="execution-card">
        <c-execution-card    
          batch-size={batchSize}
          batch-size-options={batchSizeOptions}
          onbatchsizechange={handleBatchSizeChange}
          execution-mode={executionMode}
          mode-options={executionModeOptions}
          show-scheduled-card={hideScheduledExecution}  
          onmodechange={handleExecutionModeChange} 
          onsendnotification={handleEmailNotificationChange}>
        </c-execution-card>
      </div>

      <!-- Scheduled Execution -->
      <div class="execution-card">
        <c-execution-card  
            selected-frequency={frequency}
            next-run={nextRun}
            show-scheduled-card={showScheduledExecution}
            onfrequencychange={handleFrequencyChange}
            onnextrunchange={handleNextRunChange}
            onmodechange={handleModeChange}
            onbatchsizechange={handleBatchSizeChange}
            onsendnotification={handleSendNotificationChange}>
        </c-execution-card>
      </div>
    </div>

    <template if:true={showImportProgress}>
      <div class="progress-section">
        <div class="progress-header">
          <div class="progress-header-left">
            <lightning-icon icon-name={importStatusIconName} size="small" class={statusIconClass}></lightning-icon>
            <h2 class="progress-title">{labels.progressTitle}</h2>
          </div>

          <div class="progress-header-right">
            <span class={importStatusClass}>{formattedImportStatus}</span>
            <template if:true={canCancelImport}>
              <button onclick={handleCancelImport} class="slds-m-left_small btn btn-accent">
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                 {labels.btnCancel}
              </button>
            </template>
          </div>
        </div>

        <div class="progress-content">
          <div class="progress-bar-container">
            <lightning-progress-bar value={importProgressPercentage} variant={progressBarVariant} size="large"></lightning-progress-bar>

            <div class="progress-info">
              <span class="progress-numbers">{importProgressPercentage}%</span>
            </div>

            <template if:true={importMessage}>
              <div class="progress-message">{importMessage}</div>
            </template>
          </div>

          <template if:true={currentExecutionId}>
            <div class="execution-details">
              <div class="detail-item">
                <span class="detail-label">{labels.detailExecutionId}</span>
                <span class="detail-value">{currentExecutionId}</span>
              </div>

              <div class="detail-item">
                <span class="detail-label">{labels.detailStatus}</span>
                <span class="detail-value">{formattedImportStatus}</span>
              </div>

              <template if:true={showImportResults}>
                <div class="detail-item">
                  <span class="detail-label">{labels.detailTotal}</span>
                  <span class="detail-value">{totalRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailProcessed}</span>
                  <span class="detail-value">{processedRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailSuccessful}</span>
                  <span class="detail-value success-value">{successfulRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailFailed}</span>
                  <span class="detail-value error-value">{failedRecords}</span>
                </div>
              </template>
            </div>
          </template>

          <template if:true={isImportInProgress}>
            <div class="spinner-container">
              <p class="spinner-text">{labels.processingMsg}</p>
            </div>
          </template>

          <template if:true={isImportFailed}>
            <div class="error-message">
              <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
              <div>
                <p class="msg-title">{labels.failedTitle}</p>
                <p class="msg-sub">{labels.failedSubtitle}</p>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template if:true={showImportResults}>
      <c-import-results
        execution-id={currentExecutionId}
        total-errors={totalErrors}
        failed-records={failedRecords}>
      </c-import-results>
    </template>

        <!-- Active Schedules Section -->
    <c-scheduled-schedules  
      lwc:ref="scheduledList"
      project-id={projectId}>
    </c-scheduled-schedules> 

    <div class="navigation-buttons">
      <button onclick={handlePreviousStep} class="btn btn-accent">
        <lightning-icon class="secondary-icon" size="x-small" icon-name="utility:left">
        </lightning-icon>
        <label>{labels.btnBack}</label>
      </button>
    </div>
  </div>
</template>
