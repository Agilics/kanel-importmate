<template>
  <div class="execution-container">
    <div class="page-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="header-title">{labels.title}</h1>
          <p class="header-subtitle">{labels.subtitle}</p>
        </div>

        <div class="header-actions">
          <lightning-button
            label={labels.btnExportLogs}
            variant="neutral"
            onclick={handleExportLogsCsv}
            disabled={isExportLogsDisabled}
            icon-name="utility:download"
            icon-position="left"
            class="export-button">
          </lightning-button>

          <lightning-button
            label={labels.btnSchedule}
            variant="neutral"
            onclick={handleScheduleImport}
            disabled={isScheduleImportDisabled}
            icon-name="utility:event"
            icon-position="left"
            class="schedule-button">
          </lightning-button>

          <lightning-button
            label={labels.btnStart}
            variant="brand"
            onclick={handleStartImport}
            disabled={isStartImportDisabled}
            icon-name="utility:play"
            icon-position="left"
            class="start-button">
          </lightning-button>
        </div>
      </div>
    </div>

    <template if:true={showImportProgress}>
      <div class="progress-section">
        <div class="progress-header">
          <div class="progress-header-left">
            <lightning-icon icon-name={importStatusIconName} size="small" class={statusIconClass}></lightning-icon>
            <h2 class="progress-title">{labels.progressTitle}</h2>
          </div>

          <div class="progress-header-right">
            <span class={importStatusClass}>{formattedImportStatus}</span>
            <template if:true={canCancelImport}>
              <lightning-button
                label={labels.btnCancel}
                variant="destructive-text"
                onclick={handleCancelImport}
                icon-name="utility:close"
                icon-position="left"
                class="slds-m-left_small">
              </lightning-button>
            </template>
          </div>
        </div>

        <div class="progress-content">
          <div class="progress-bar-container">
            <lightning-progress-bar value={importProgressPercentage} variant={progressBarVariant} size="large"></lightning-progress-bar>

            <div class="progress-info">
              <span class="progress-numbers">{importProgressPercentage}%</span>
            </div>

            <template if:true={importMessage}>
              <div class="progress-message">{importMessage}</div>
            </template>
          </div>

          <template if:true={currentExecutionId}>
            <div class="execution-details">
              <div class="detail-item">
                <span class="detail-label">{labels.detailExecutionId}</span>
                <span class="detail-value">{currentExecutionId}</span>
              </div>

              <div class="detail-item">
                <span class="detail-label">{labels.detailStatus}</span>
                <span class="detail-value">{formattedImportStatus}</span>
              </div>

              <template if:true={showImportResults}>
                <div class="detail-item">
                  <span class="detail-label">{labels.detailTotal}</span>
                  <span class="detail-value">{totalRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailProcessed}</span>
                  <span class="detail-value">{processedRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailSuccessful}</span>
                  <span class="detail-value success-value">{successfulRecords}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">{labels.detailFailed}</span>
                  <span class="detail-value error-value">{failedRecords}</span>
                </div>
              </template>
            </div>
          </template>

          <template if:true={isImportInProgress}>
            <div class="spinner-container">
              <p class="spinner-text">{labels.processingMsg}</p>
            </div>
          </template>

          <template if:true={isImportFailed}>
            <div class="error-message">
              <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
              <div>
                <p class="msg-title">{labels.failedTitle}</p>
                <p class="msg-sub">{labels.failedSubtitle}</p>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template if:true={showImportResults}>
      <c-import-results
        execution-id={currentExecutionId}
        total-errors={totalErrors}
        failed-records={failedRecords}>
      </c-import-results>
    </template>

    <div class="navigation-buttons">
      <lightning-button
        label={labels.btnBack}
        onclick={handlePreviousStep}
        variant="neutral"
        icon-name="utility:left"
        icon-position="left">
      </lightning-button>
    </div>
  </div>
</template>
