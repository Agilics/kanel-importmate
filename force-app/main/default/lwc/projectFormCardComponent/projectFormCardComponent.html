<template>
  <div
    class="main-content"
    style="width: 1120px; height: 1517px; left: 320px; angle: 0 deg; opacity: 1"
  >
    <!-- Header -->
    <div class="header">
      <lightning-icon
        icon-name="utility:add"
        alternative-text="Add"
        class="plus-icons margin-icon"
      ></lightning-icon>

      <div class="text-header">
        <h1>Create New Import Project</h1>
        <p class="subtitle">
          Set up your data import project with target object and configuration
        </p>
      </div>
    </div>

    <!-- Card container -->
    <section
      class="card"
      style="
        width: 1056px;
        height: 1053px;
        top: 172px;
        left: 32px;
        angle: 0 deg;
        opacity: 1;
        border-radius: 12px;
        border-width: 1px;
      "
    >
      <!-- Project Information -->
      <div class="section-header">
        <lightning-icon
          icon-name="utility:info"
          alternative-text="Info"
          class="icon-colors plus-icons"
        ></lightning-icon>
        <h2>Project Information</h2>
      </div>
      <label class="custom-label name-label" for="project-name">
        Project Name <span class="required">*</span>
      </label>
      <lightning-input
        id="project-name"
        class="rounded-input"
        style="width: 100%"
        type="text"
        placeholder="Enter a descriptive project name (e.g., Q4 Contact Import)"
        onchange={handleProjectNameChange}
      ></lightning-input>
      <p class="help-text">
        Choose a clear, descriptive name for easy identification
      </p>

      <!--Description textarea -->
      <label class="description-label" for="project-name"> Description </label>
      <lightning-textarea
        class="input-field rounded-input"
        placeholder="Describe the purpose and scope of this import project..."
        onchange={handleDescriptionChange}
      ></lightning-textarea>
      <p class="help-text" style="margin: 6em 0 0.75rem 0">
        Provide details about data source, business purpose, and expected
        outcomes
      </p>

      <hr class="divider" />

      <!-- Target Object Configuration -->
      <div class="section-header" style="margin-top: 1.5rem">
        <lightning-icon
          icon-name="utility:campaign"
          alternative-text="Campaign"
          class="icon-colors plus-icons"
        ></lightning-icon>
        <h2>Target Object Configuration</h2>
      </div>

      <div class="form-grid">
        <div class="form-item">
          <label class="custom-label target-label" for="project-name">
            Target Salesforce Object <span class="required">*</span>
          </label>
          <lightning-combobox
            value={targetObject}
            options={options}
            class="rounded-input"
            onchange={handleTargetObjectChange}
          ></lightning-combobox>
          <p class="help-text">
            Select the Salesforce object where data will be imported
          </p>
        </div>
        <!--Import Operation-->
        <div class="form-item">
          <!--
          <lightning-combobox
            label="Import Operation"
            value={importOperation}
            options={importOptions}
            required
            onchange={handleImportOperationChange}
          ></lightning-combobox>
          <p class="help-text">Choose how the data should be processed</p>
        --></div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <c-project-form-footer-component
          onsave={handleCreateProject}
          oncancel={handleCancel}
        ></c-project-form-footer-component>
      </div>
    </section>
  </div>
</template>
