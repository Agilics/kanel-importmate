<template>
  <section class="cards" aria-label="Project options">
    
    <!-- Create New Project -->
    <a
      class="card"
      tabindex="0"
      role="button"
      aria-pressed="false"
      onclick={handleShow}
      aria-label={labels.PROJECT_RECENT_TITLE}
    >
      <div class="header is-center">
        <div class="icon-container" aria-hidden="true">
          <lightning-icon
            icon-name="utility:add"
            alternative-text="add"
          ></lightning-icon>
        </div>
        <h3>{labels.PROJECT_RECENT_TITLE}</h3>
      </div>
    </a>

    <!-- Use Existing Project -->
    <a
      onclick={handleFindExistingProject}
      class="card"
      tabindex="0"
      role="button"
      aria-pressed="false"
      aria-label={labels.PROJECT_RECENT_USE_EXISTING}
    >
      <div class="header is-center">
        <lightning-icon
          icon-name="utility:form"
          alternative-text="form"
          size="large"
        ></lightning-icon>

        <h3>{labels.PROJECT_RECENT_USE_EXISTING}</h3>
      </div>

      <p>
        {labels.PROJECT_RECENT_USE_EXISTING_DESC}
      </p>
    </a>
  </section>

  <!-- Recent Projects Section -->
  <section class="recent-projects-wrapper" aria-label="Recent Projects">
    
    <div class="recent-title">
      {labels.PROJECT_RECENT_RECENT_PROJECTS}
    </div>

    <!-- No Project Case -->
    <template if:true={hasNoProjects}>
      <h3 class="empty slds-text-align_center">
        <lightning-icon
          icon-name="action:info"
          alternative-text="info"
          size="large"
          style="margin-right: 10px"
        ></lightning-icon>
        {labels.PROJECT_RECENT_NO_PROJECT}
      </h3>
    </template>

    <!-- Projects List -->
    <template if:false={hasNoProjects}>
      <div class="recent-projects">
        <template for:each={formattedProjects} for:item="pro">
          
          <div class="project-item" key={pro.Id}>

            <!-- Project Name -->
            <span class="project-name">
              {pro.Name}
            </span>

            <!-- Target + Button -->
            <div class="project-row">
              <span class="project-meta">
                {labels.PROJECT_RECENT_TARGET_SOBJECT}: {pro.TargetObject__c}
              </span>

              <button
                key={pro.Id}
                data-id={pro.Id}
                class="btn-select"
                type="button"
                aria-label={labels.PROJECT_RECENT_SELECT_PROJECT}
                onclick={handleShowSelectProject}
              >
                {labels.PROJECT_RECENT_SELECT_PROJECT}
              </button>
            </div>

            <!-- Created Date -->
            <small class="project-meta">
              {labels.PROJECT_RECENT_CREATED_LABEL}
              {pro.formattedDate}
            </small>

          </div>

        </template>
      </div>
    </template>

  </section>
</template>
